services:
  lean:
    # Default: pull the published image (no local build).
    #   docker compose pull lean && docker compose up -d lean
    # To rebuild locally instead (after changing Dockerfile/entrypoint.sh/
    # requirements-container.txt):
    #   docker compose build lean && docker compose up -d lean
    image: sinuhe96/fermat-lean:latest
    build:
      context: .
      # Persist the build layer cache so a rebuild after ANY failure
      # resumes from the last good layer instead of restarting.
      cache_from:
        - type=local,src=.buildcache
      cache_to:
        - type=local,dest=.buildcache,mode=max
    volumes:
      - ./proof:/workspace/proof
      # Python tools may use these Windows bind mounts. Lean sources are copied
      # from /workspace/pipeline into the Linux lake-work volume before Lake runs.
      - ./pipeline:/workspace/pipeline
      - ./PROOF_of_FERMAT.pdf:/workspace/source/PROOF_of_FERMAT.pdf:ro
      - lake-work:/workspace/work
      - lean-elan:/elan-home
      # Lake Mathlib download cache (~/.cache/mathlib *.ltar). Without this,
      # every container recreate re-downloads GBs from scratch.
      - lake-cache:/root/.cache
      # Never run Lake in /workspace/proof, /workspace/pipeline, or any other
      # Windows bind mount. Lake work happens only in /workspace/work.
    working_dir: /workspace/work
    environment:
      ELAN_HOME: /elan-home
      LEAN_TOOLCHAIN: leanprover/lean4:v4.35.0-rc2
    tty: true
    stdin_open: true
    # Mathlib elaboration is RAM-hungry. The old 6g cap was reached
    # repeatedly (cgroup memory.peak pinned at the cap, 5.6M at-limit
    # reclaim events) during the unexplained 300-371s slow rounds, while a
    # Mathlib load measures ~7.3GB peak. 10g sits above that peak and below
    # the ~12.7GiB Docker VM (wslconfig: memory=13GB, swap=6GB). Speculative
    # fix; proof/mem_watch.sh samples the cgroup counters to confirm.
    mem_limit: 10g
    cpus: 10

  # CPU inference for 7B prover/math models (GGUF via llama.cpp server, OpenAI-compatible on :8080)
  # Default model: Qwen2.5-Math-7B-Instruct Q4_K_M (~4.7GB) — only confirmed GGUF in this family.
  # Kimina-7B / Goedel-SFT ship as safetensors only (verified via HF API), so they need
  # a one-time quantize step (see README below) before they can serve here.
  prover:
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"
    command: >
      -m /models/Qwen2.5-Math-7B-Instruct-Q4_K_M.gguf
      --host 0.0.0.0 --port 8080
      -c 4096 -n 2048
      --threads 10
    mem_limit: 6g

volumes:
  lean-elan:
  lake-cache:
  lake-work:
