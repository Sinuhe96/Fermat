name = "testproj"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Testproj"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "Testproj"

# Chunk libraries. `roots` is explicit: a `lean_lib` named `L3` would otherwise
# look for `L3.lean`, while our modules live at `L3/Basic.lean`.
# Building one of these ONCE produces `Lk/Basic.olean`, so a consumer chunk that
# does `import Lk.Basic` reuses the verified proof instead of re-elaborating it
# on every compile — and, more importantly, instead of pasting a copy that can
# drift from the thing that was verified (ENCODING_MAP §A "Reusing a DONE
# chunk"). `proof/compile_lean.sh` syncs this file into
# /workspace/work/testproj and publishes the olean of every module it compiles,
# so a chunk becomes importable by being compiled once.
[[lean_lib]]
name = "Common"
roots = ["Common.Basic"]

[[lean_lib]]
name = "L1"
roots = ["L1.Basic"]

[[lean_lib]]
name = "L2"
roots = ["L2.Basic"]

[[lean_lib]]
name = "L3"
roots = ["L3.Basic"]

[[lean_lib]]
name = "L4"
roots = ["L4.Basic"]

[[lean_lib]]
name = "L5"
roots = ["L5.Basic"]

[[lean_lib]]
name = "L6"
roots = ["L6.Basic"]

# L7 (bổ đề 7): FRAG-01's non-divisibility conclusion S0–S6 are all S1 (S5c is
# the F3 difference instance, S6 the printed product); the remaining conclusion
# groups live in the L7F2…L7F6 leaves and are chained by L7ASM.
[[lean_lib]]
name = "L7"
roots = ["L7.Basic"]

# L7's remaining conclusion groups (bổ đề 7): each leaf is one group of the
# printed proof, and L7ASM chains them into the lemma's full conclusion list.
[[lean_lib]]
name = "L7F2"
roots = ["L7F2.Basic"]

[[lean_lib]]
name = "L7F3"
roots = ["L7F3.Basic"]

[[lean_lib]]
name = "L7F4"
roots = ["L7F4.Basic"]

[[lean_lib]]
name = "L7F5"
roots = ["L7F5.Basic"]

[[lean_lib]]
name = "L7F6"
roots = ["L7F6.Basic"]

[[lean_lib]]
name = "L7ASM"
roots = ["L7ASM.Basic"]
