name = "testproj"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Testproj"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "Testproj"

# Chunk libraries. `roots` is explicit: a `lean_lib` named `L3` would otherwise
# look for `L3.lean`, while our modules live at `L3/Basic.lean`.
# Building one of these ONCE produces `Lk/Basic.olean`, so a consumer chunk that
# does `import Lk.Basic` reuses the verified proof instead of re-elaborating it
# on every compile — and, more importantly, instead of pasting a copy that can
# drift from the thing that was verified (ENCODING_MAP §A "Reusing a DONE
# chunk"). `proof/compile_lean.sh` syncs this file into
# /workspace/work/testproj and publishes the olean of every module it compiles,
# so a chunk becomes importable by being compiled once.
[[lean_lib]]
name = "Common"
roots = ["Common.Basic"]

[[lean_lib]]
name = "L1"
roots = ["L1.Basic"]

[[lean_lib]]
name = "L2"
roots = ["L2.Basic"]

[[lean_lib]]
name = "L3"
roots = ["L3.Basic"]

[[lean_lib]]
name = "L4"
roots = ["L4.Basic"]

[[lean_lib]]
name = "L5"
roots = ["L5.Basic"]

[[lean_lib]]
name = "L6"
roots = ["L6.Basic"]

# L7 (bổ đề 7): FRAG-01's non-divisibility conclusion S0–S6 are all S1 (S5c is
# the F3 difference instance, S6 the printed product); the remaining conclusion
# groups live in the L7F2…L7F6 leaves and are chained by L7ASM.
[[lean_lib]]
name = "L7"
roots = ["L7.Basic"]

# L7's remaining conclusion groups (bổ đề 7): each leaf is one group of the
# printed proof, and L7ASM chains them into the lemma's full conclusion list.
[[lean_lib]]
name = "L7F2"
roots = ["L7F2.Basic"]

[[lean_lib]]
name = "L7F3"
roots = ["L7F3.Basic"]

[[lean_lib]]
name = "L7F4"
roots = ["L7F4.Basic"]

[[lean_lib]]
name = "L7F5"
roots = ["L7F5.Basic"]

[[lean_lib]]
name = "L7F6"
roots = ["L7F6.Basic"]

[[lean_lib]]
name = "L7ASM"
roots = ["L7ASM.Basic"]

# Section B of the print (p. 2, `P002-R1`): the two sum-transformation rules the
# main proof cites as "áp dụng mục B.1 / B.2, trang 2" (pp. 9, 10, 11, 13, 14).
# Not covered by the L-ledger, which verifies section C (the proofs of lemmas
# 1-7); it is a prerequisite of every main-proof leaf from p. 9 on.
[[lean_lib]]
name = "B"
roots = ["B.Basic"]

# The main proof, §D.1 ("n là số nguyên tố lớn hơn 11"), leaf by leaf. M1F1 is
# `M1-FRAG-01` (p. 6, `P006-R1`): the bổ đề 6 substitution and the sign symmetry.
# Later leaves get their own `M1Fn` module as they are opened.
[[lean_lib]]
name = "M1F1"
roots = ["M1F1.Basic"]

# M1F2 is `M1-FRAG-02` (p. 6, `P006-R2`): the printed (7) mod n^(2s+1) and its
# companion (7') mod n^(s+1), both read off the expansion of the substituted
# equation that M1F1's S4 produces.
[[lean_lib]]
name = "M1F2"
roots = ["M1F2.Basic"]

# M1F3 is `M1-FRAG-03` (p. 6, `P006-R2`): the printed (8), (9) and (10) — the
# same expansion at orders 2, 3 and 4, sharing M1F2's `C(n,i)` divisibility
# lemma and generalizing M1F2's two-term truncation to any order.
[[lean_lib]]
name = "M1F3"
roots = ["M1F3.Basic"]

# M1F4 is `M1-FRAG-04` (p. 6 `R3` + p. 7 `R1`): the `l+j` regrouping. IN PROGRESS
# — S0 (the triple-sum expansion) and S1 (the printed right-hand side) are written
# and compile; the remaining six steps are listed in the chunk record. It imports
# M1F3 for the `X`-indexed binomial expansion.
[[lean_lib]]
name = "M1F4"
roots = ["M1F4.Basic"]
