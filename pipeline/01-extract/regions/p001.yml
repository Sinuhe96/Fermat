      \[ \text{Nhà toán học người Pháp Pierre de Fermat (1601--1665) đã đặt ra một định lý nổi tiếng:} \]
      \[ \text{``phương trình } x^n + y^n = z^n \text{, trong đó } n \text{ là một số nguyên lớn hơn 2, không thể tìm được nghiệm nguyên thỏa mãn} \]
      \[ xyz \neq 0 \text{.''. Đây là định lý Fermat cuối cùng. Ông đã viết lên lề cuốn sách một tuyên bố nhưng không cung cấp} \]
      \[ \text{chứng minh, chỉ để lại dòng chú thích: ``Tôi có một phương pháp rất xuất sắc để chứng minh cho trường hợp tổng} \]
      \[ \text{quát, nhưng không thể viết ra được ở đây vì lề sách quá hẹp!''} \]
      \[ \text{Các nhà toán học sau đó đã cố gắng giải quyết bài toán này trong suốt gần bốn thế kỷ. Cuối cùng, nhà toán học} \]
      \[ \text{Andrew Wiles (người Anh, định cư tại Mỹ, sinh năm 1953) đã công bố lời giải duy nhất và không thể nào cản trở} \]
      \[ \text{được vào mùa hè năm 1993, và sau đó là một phiên bản sửa đổi vào năm 1995.} \]
      \[ \text{Trong một khoảng thời gian dài, tôi đã cố gắng chứng minh định lý này bằng cách sử dụng lý thuyết số cơ bản và} \]
      \[ \text{cuối cùng đã thành công. Dưới đây là toàn văn của phần chứng minh định lý Fermat lớn.} \]
      \[ \text{Để chứng minh định lý Fermat lớn này, tôi trình bày bảy bổ đề và một phương pháp biến đổi tổng } \sum_{2} \text{ cùng với} \]
      \[ \text{việc sử dụng đạo hàm cấp } k \text{ của hàm số đa thức một biến để tính tổng } \sum_{2}. \]
