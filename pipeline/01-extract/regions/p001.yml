      \[ \textcolor{red}{\textbf{\textit{Bổ đề 1:}}} \]
      \[ \text{Cho } n \in \mathbb{N}, n \ge 3 \text{. Nếu phương trình (PT) } x^n + y^n = z^n \text{ (1) có nghiệm nguyên khác không thì bao giờ cũng tồn tại} \]
      \[ \text{nghiệm nguyên } x = u, y = v, z = t \text{ sao cho } (u,v) = (u,t) = (v,t) = 1. \]
      \[ \textcolor{red}{\textbf{\textit{Bổ đề 2:}}} \]
      \[ \text{Nếu có } n \in \mathbb{N}, n \ge 3 \text{, PT } x^n + y^n = z^n \text{ vô nghiệm nguyên khác không thì với mọi } k \in \mathbb{N}^*, \text{ PT } x^{nk} + y^{nk} = z^{nk} \]
      \[ \text{cũng vô nghiệm nguyên khác không.} \]
      \[ \textcolor{red}{\textbf{\textit{Bổ đề 3:}}} \]
      \[ \text{Cho } a.b = c^n, n \text{ là số nguyên dương lẻ}; a,b,c \in \mathbb{Z}^* \text{ sao cho } (a,b) = 1 \text{, khi đó tồn tại hai số nguyên khác không } c_1, c_2 \]
      \[ \text{sao cho } (c_1,c_2) = 1, c = c_1.c_2, a = c_1^n \text{ và } b = c_2^n. \]
      \[ \textcolor{red}{\textbf{\textit{Bổ đề 4:}}} \]
      \[ \text{Cho } a.b = c^n, n \text{ là số nguyên dương lẻ}, a,b,c,m \in \mathbb{Z}^*, \text{ sao cho } |a| \ge 2, |b| \ge 2, |c| \ge 2, m \text{ là số nguyên tố}, (a,b) = m, \]
