      \[ \Rightarrow -2^{n-2} + 2 \equiv 0 \pmod n \text{ (vì } b \not\vdots n \text{)} \]

      \[ \Rightarrow -(2^{n-1} - 1) + 3 \equiv 0 \pmod n \text{, (vì } 2^{n-1} - 1 \equiv 0 \pmod n \text{, định lý nhỏ Fermat)} \]

      \[ \Rightarrow 3 \equiv 0 \pmod n \]

      \[ \Rightarrow n=3, \text{ vô lý.} \]

      \[ \text{Vậy } b^n + c^n \not\equiv 0 \pmod n \text{. Chứng minh tương tự ta cũng có } a^n + b^n \not\equiv \pmod n, c^n + a^n \not\equiv 0 \pmod n. \text{ Tóm lại, ta} \]

      \[ \text{luôn có: } (a^n - b^n)(c^n + a^n)(c^n + b^n) \not\equiv 0 \pmod n \text{ (đpcm).} \]

      \[ \text{* Vì } c^n + b^n \not\equiv 0 \pmod n, \quad b^{3n} + c^{3n} = (b^n + c^n)[(c^n - b^n)^2 + b^n c^n] \equiv (b^n + c^n)(a^{2n} + b^n c^n) \equiv 0 \pmod{n^2} \text{ nên} \]

      \[ a^{2n} + b^n c^n \equiv 0 \pmod{n^2} \]

      \[ \text{Chứng minh tương tự ta cũng có } b^{2n} + a^n c^n \equiv c^{2n} - a^n b^n \equiv 0 \pmod{n^2}. \]

      \[ \text{* Ta có } c^{2n} - a^n b^n \equiv 0 \pmod{n^2} \]

      \[ \Rightarrow c^n (a^n + b^n) - a^n b^n \equiv 0 \pmod{n^2} \text{ (vì } a^n + b^n \equiv c^n \pmod{n^2} \text{)} \]

      \[ \Rightarrow c^n a^n . 1 + c^n b^n . 1 - a^n b^n . 1 \equiv 0 \pmod{n^2} \]

      \[ \Rightarrow c^n a^n b^{n(n-1)} + c^n b^n a^{n(n-1)} - a^n b^n c^{n(n-1)} \equiv 0 \pmod{n^2} \text{ (theo bổ đề 5 d)), ta có } a^{n(n-1)} \equiv b^{n(n-1)} \equiv c^{n(n-1)} \equiv 1 \pmod{n^2} \text{)} \]

      \[ \Rightarrow b^{n(n-2)} + a^{n(n-2)} - c^{n(n-2)} \equiv 0 \pmod{n^2} \text{ (đpcm).} \]

      \[ \text{* Vì n là số nguyên tố lớn hơn 3 nên } n \equiv \pm 1 \pmod 6 \]

      \[ \text{Giả sử } n \equiv -1 \pmod 6, \text{ suy ra } n = 6l - 1, l \in \mathbb{N}^*. \text{ Khi đó, từ } a^{n(n-2)} + b^{n(n-2)} - c^{n(n-2)} \equiv 0 \pmod{n^2}, \text{ ta suy ra} \]

      \[ a^{3n(2l-1)} + b^{3n(2l-1)} - c^{3n(2l-1)} \equiv 0 \pmod n \]

      \[ \Rightarrow a^{3n(2l-1)} + a^{3n(2l-1)} + a^{3n(2l-1)} \equiv 0 \pmod{n^2} \text{ (vì } c^{3n} \equiv -a^{3n} \pmod{n^2}, b^{3n} \equiv a^{3n} \pmod{n^2}) \]

      \[ \Rightarrow 3a^{n(n-2)} \equiv 0 \pmod{n^2}, \text{ vô lý (vì n là số nguyên tố lớn hơn 3 và } a^{n(n-2)} \not\equiv 0 \pmod n.) \]

      \[ \text{Vậy } n \equiv 1 \pmod 6 \text{ (đpcm).} \]

      \[ \text{* Vì } n \equiv 1 \pmod 6, \text{ nên } n = 6l + 1, l \in \mathbb{N}^*. \text{ Do đó} \]

      \[ a^{n(n-4)} + c^{n(n-4)} = a^{3n(2p-1)} + (c^{3n})^{(2p-1)} \equiv a^{3n(2p-1)} - a^{3n(2p-1)} = 0 \pmod n \text{ (vì } c^{3n} \equiv -a^{3n} \pmod{n^2} \text{), suy ra} \]

      \[ a^{n(n-4)} + c^{n(n-4)} \equiv 0 \pmod{n^2}. \]

      \[ \text{Chứng minh tương tự ta cũng có: } b^{n(n-4)} + c^{n(n-4)} \equiv 0 \pmod{n^2} \text{ suy ra } a^{n(n-4)} - b^{n(n-4)} \equiv 0 \pmod n \text{ (đpcm).} \]

