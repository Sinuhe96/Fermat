      \[ \Rightarrow a^n b^n \equiv c^{2n} \pmod n \text{ (d) (vì } a^n + b^n \equiv c^n \pmod{n^2} \text{)} \]

      \[ \Rightarrow a^n b^n \equiv (a^n + b^n)^2 \pmod n \]

      \[ \Rightarrow b^{2n} + a^n b^n + a^{2n} \equiv 0 \pmod n \]

      \[ \Rightarrow b^{2n} + a^n (a^n + b^n) \equiv 0 \pmod n \]

      \[ \Rightarrow b^{2n} + a^n c^n \equiv 0 \pmod n \text{ (vì } a^n + b^n \equiv c^n \pmod{n^2} \text{)} \]

      \[ \Rightarrow b^{3n} + c^n (a^n b^n) \equiv 0 \pmod n \]

      \[ \Rightarrow b^{3n} + c^{3n} \equiv 0 \pmod n \text{ (vì } a^n b^n \equiv c^{2n} \pmod n \text{)} \]

      \[ \Rightarrow (b^{3n})^n + (c^{3n})^n \equiv 0 \pmod{n^2} \text{ (áp dụng bổ đề 5c)} \]

      \[ \Rightarrow (b^3)^{n(n-1)} . b^{3n} + (c^3)^{n(n-1)} . c^{3n} \equiv 0 \pmod{n^2} \]

      \[ \Rightarrow b^{3n} + c^{3n} \equiv 0 \pmod{n^2} \text{ (áp dụng bổ đề 5d): } (b^3)^{n(n-1)} \equiv (c^3)^{n(n-1)} \equiv 1 \pmod{n^2} \text{)} \]

      \[ \text{Lưu ý rằng trong hai giả thiết đồng dư (c) và (b) của Bổ đề 7 có mỗi cặp } (a; b), (c; -a), (c; -b) \text{ đối xứng nhau, nó bình đẳng và có cùng cấu trúc số học trong vành } \mathbb{Z}. \text{ Cho nên, nếu có } b^{3n} + c^{3n} \equiv 0 \pmod{n^2} \text{ thì ta cũng có} \]

      \[ a^{3n} + c^{3n} \equiv a^{3n} + (-b)^{3n} \equiv 0 \pmod{n^2} \quad a^{3n} + c^{3n} \equiv a^{3n} - b^{3n} \equiv 0 \pmod{n^2}. \text{ hay } a^{3n} + c^{3n} \equiv a^{3n} - b^{3n} \equiv 0 \pmod{n^2}. \]

      \[ \text{* Nếu } b^n + c^n \equiv 0 \pmod n \text{ thì } c^n \equiv -b^n \pmod n \text{, kết hợp với (b) và (c), ta có } a^n \equiv -2b^n \pmod n \text{ và} \]

      \[ (-b^n)^{n-2} \equiv a^{n(n-2)} + b^{n(n-2)} \pmod n \]

      \[ \Rightarrow a^{n(n-2)} + 2b^{n(n-2)} \equiv 0 \pmod n \text{ , (vì n lẻ)} \]

      \[ \Rightarrow (-2b^n)^{n-2} + 2b^{n(n-2)} \equiv 0 \pmod n \]

      \[ \Rightarrow -2^{n-2} b^{n(n-2)} + 2b^{n(n-2)} \equiv 0 \pmod n \]
