      \[ \text{thì } C_n^k \vdots n \text{ và } [(u+v)^{n-1}-1]\vdots n \text{ (định lý nhỏ Fermat). Do đó } (c'^{n}-1)\vdots n, \text{ mà } c'\not\vdots n \text{ nên } (c'^{n-1}-1)\vdots n, \text{ suy ra } c'^{n}-1-(c'^{n-1}-1)=c'^{n-1}(c'-1)\vdots n, \text{ suy ra } c'(c'-1)\vdots n, \text{ suy ra } c'=1+n k_3, \text{ với } k_3\in\mathbb{Z}. \text{ Chứng minh tương tự ta cũng có } a'=1+n k_1,\ b'=1+n k_2, \text{ với } k_1,k_2\in\mathbb{Z}, \text{ suy ra } t^n-u-v=(c.c')^n-c^n=c^n[(1+n k_3)^n-1]\vdots n^2. \text{ Chứng minh tương tự ta cũng có } (u^n-t+v)\vdots n^2 \text{ và } (v^n-t+u)\vdots n^2 \text{ suy ra } (u^n-t+v)+(v^n-t+u)-(t^n-u-v)=2(u+v-t)\vdots n^2, \text{ suy ra } (u+v-t)\vdots n^2. \text{ Từ (4'), (5'), (6') và } (a,b)=(a,c)=(c,b)=1 \text{ ta có } u+v-t=c(c^{n-1}-c')=a(a'-a^{n-1})=b(b'-b^{n-1})=n^s abck, \text{ với } k\in\mathbb{Z},\ s\in\mathbb{Z},\ s\ge 2,\ (k,a)=(k,b)=(k,c)=1,\ k\not\vdots n, \text{ nếu } k\ne 0. \text{ Suy ra } u=b^n+n^s abck,\ v=a^n+n^s abck,\ t=c^n-n^s abck,\ a^n+b^n=c^n-2n^s abck. \]

      \[ \textbf{6.2. Khi } t \text{ chia hết cho } n \]

      \[ \text{Từ (4) suy ra } (u+v)\vdots n \text{, áp dụng bổ đề 5b) ta có } \left( u+v,\sum_{i=0}^{n-1}(-1)^i u^{n-1-i}v^i \right)=n \text{ và } \left( \sum_{i=0}^{n-1}(-1)^i u^{n-1-i}v^i \right)\not\vdots n^2, \text{ kết hợp với (4) và áp dụng bổ đề 4, ta có: } u+v=n^{sn-1}c^n\ (4'') \text{ và } \sum_{i=0}^{n-1}(-1)^i u^{n-1-i}v^i=n c'^n \text{ với } t=n^s c.c',\ s\in\mathbb{N}^*;\ c,c'\in\mathbb{Z}^*,\ (c,c')=1,\ c\not\vdots n,\ c'\not\vdots n. \text{ Ta có } t^n-u-v=(n^s c.c')^n-n^{sn-1}c^n=n^{sn-1}c^n[n c'^n-1]\vdots n^2\ (5'')\ \text{(vì } n \text{ là số nguyên tố lẻ, } s\in\mathbb{N}^* \text{). Từ (5), (6) suy ra } (t-v)\not\vdots n \text{ và } (t-u)\not\vdots n, \text{ áp dụng bổ đề 5a) ta có } \left( t-v,\sum_{i=0}^{n-1}t^{n-1-i}v^i \right)=\left( t-u,\sum_{i=0}^{n-1}t^{n-1-i}u^i \right)=1,\ \left( \sum_{i=0}^{n-1}t^{n-1-i}v^i \right)\not\vdots n,\ \left( \sum_{i=0}^{n-1}t^{n-1-i}u^i \right)\not\vdots n, \text{ kết hợp với (5), (6) và áp dụng bổ đề 3 ta có } t-v=b^n\ (5') \text{ và } \sum_{i=0}^{n-1}t^{n-1-i}v^i=b'^n, \text{ với } u=b b',\ b,b'\in\mathbb{Z}^*,\ (b,b')=1,\ b\not\vdots n,\ b'\not\vdots n;\ t-u=a^n\ (6'), \text{ với } v=a a',\ a,a'\in\mathbb{Z}^*,\ (a,a')=1,\ a\not\vdots n,\ a'\not\vdots n;\ (a,b)=(a,c)=(c,b)=1. \]

      \[ \text{Lập luận như 6.1. ta có } b'=1+n k_2,\ a'=1+n k_1, \text{ suy ra } u^n-t+v=(b.b')^n-b^n=b^n[(1+n k_2)^n-1]\vdots n^2\ (5'') \text{ (và } v^n-t+u=(a.a')^n-a^n=a^n[(1+n k_1)^n-1]\vdots n^2\ (6''), \text{ kết hợp (4''),(5'') và (6'') suy ra } (u^n-t+v)+(v^n-t+u)-(t^n-u-v)=2(u+v-t)\vdots n^2, \text{ suy ra } (u+v-t)\vdots n^2, \text{ mà } u+v-t=n^s c(n^{ns-1-s} c^{n-1}-c')=a(a'-a^{n-1})=b(b'-b^{n-1})=n^s abck \text{ nên } s\ge 2;(k,a)=(k,b)=(k,c)=1 \text{ và } k\not\vdots n, \text{ nếu } k\ne 0. \text{ Suy ra } v=a^n+n^s abck,\ u=b^n+n^s abck,\ t=n^{ns-1}c^n-n^s abck,\ a^n+b^n=n^{ns-1}c^n-2n^s abck. \]

      \[ \textbf{6.2.1. Khi } k = 0 \]

      \[ \text{Ta nhận thấy khi } k=0 \text{ thì } t-u=v,\ t-v=u, \text{ hay } a^n=a.a',\ b^n=b.b', \text{ suy ra } a^{n-1}=a',\ b^{n-1}=b' \Rightarrow |a|=|a'|=|b|=|b'|=1 \text{ (vì } (a,a')=(b,b')=1 \text{)} \]
