      \[ \text{\textbf{D. CHỨNG MINH ĐỊNH LÝ LỚN FERMAT}} \]

      \[ \text{\textbf{1. Khi }} n \text{\textbf{ là số nguyên tố lớn hơn 11}} \]

      \[ \text{Giả sử có số nguyên tố } n \text{ lớn hơn 11, sao cho PT (1) có nghiệm nguyên khác không } x = u,\ y = v,\ z = t, \text{ trong đó } (u,v) = (u,t) = (v,t) = 1 \text{ (áp dụng \textbf{bổ đề 1}). Khi đó } u^n + v^n = t^n \text{ (3). Vì } n \text{ lẻ và } u, v, t \text{ là các số nguyên, nên } u^n + v^n = t^n \iff v^n + u^n = t^n \iff (-t)^n + v^n = (-u)^n \iff u^n + (-t)^n = (-v)^n \text{; do đó, tính chất số học và vai trò của } u, v, t \text{ là như nhau; cho nên, không mất tính tổng quát ta giả sử } u \nmid n,\ v \nmid n, \text{ áp dụng \textbf{bổ đề 6}, ta có: } v = a^n + n^s abck,\ u = b^n + n^s abck,\ t = h - n^s abck,\ a^n + b^n = h - 2n^s abck \text{; với } (h = c^n, \text{ khi } t \nmid n) \vee (h = n^{ns-1}c^n, \text{ khi } t : n), \text{ trong đó } a, b, c, k \text{ là bốn số nguyên khác không và đôi một nguyên tố cùng nhau, đồng thời không chia hết cho } n,\ s \in \mathbb{Z},\ s \ge 2. \]

      \[ \text{Ta có: } (3) \Rightarrow (a^n + n^s abck)^n + (b^n + n^s abck)^n = (h - n^s abck)^n \]

      \[ \iff h^n - a^{n^2} - b^{n^2} - n[a^{n(n-1)} + b^{n(n-1)} + h^{n-1}]n^s abck - \frac{n(n-1)}{2}[b^{n(n-2)} + a^{n(n-2)} - h^{n-2}](n^s abck)^2 - \]

      \[ - \frac{n(n-1)(n-2)}{6}[a^{n(n-3)} + b^{n(n-3)} + h^{n-3}](n^s abck)^3 - \frac{n(n-1)(n-2)(n-3)}{24}[b^{n(n-4)} + a^{n(n-4)} - h^{n-4}](n^s abck)^4 - \]

      \[ - \ldots - n(a^n + b^n - h)(n^s abck)^{n-1} - 3(n^s abck)^n = 0, \text{ suy ra} \]
