      \[ \text{Mặt khác ta có } t^n - u^n = v^n \Leftrightarrow (t-u)\sum_{i=0}^{n-1} t^{n-1-i}u^i = v^n \Leftrightarrow a^n\sum_{i=0}^{n-1}(h - n^s abck)^{n-1-i}(b^n + n^s abck)^i = (a^n + n^s abck)^n \]

      \[ \Leftrightarrow \sum_{i=0}^{n-1}(h - n^s abck)^{n-1-i}(b^n + n^s abck)^i = (a^{n-1} + n^s bck)^n \]

      \[ \Leftrightarrow \sum_{i=0}^{n-1}\sum_{j=0}^{n-1-i}\sum_{l=0}^{i}(-1)^j C_{n-1-i}^{j} C_i^{l} h^{n-1-i-j} b^{n(i-l)} (n^s abck)^{l+j} = \sum_{i=0}^{n} C_n^i a^{(n-1)(n-i)}(n^s bck)^i \]
