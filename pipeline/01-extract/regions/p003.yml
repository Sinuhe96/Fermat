      \[ \text{* Nếu } uv \not\vdots n \text{ thì } u \not\vdots n, v \not\vdots n \text{, suy ra } u^{n-1} \equiv v^{n-1} \equiv 1 \pmod n \text{ (định lý nhỏ Fermat) suy ra } u^{n-1} - v^{n-1} = (u^{n-1} - 1) - (v^{n-1} - 1) \equiv 0 \pmod n. \]

      \[ \text{Giả sử } (u+v) \not\vdots n \text{, ta có } \sum_{i=0}^{n-1} (-1)^i u^{n-1-i} v^i = u^{n-1} - v \sum_{i=0}^{n-2} (-1)^i u^{n-2-i} v^i = u^{n-1} - \frac{v(u^{n-1} - v^{n-1})}{u+v} \equiv u^{n-1} \equiv 1 \pmod n \text{, suy ra} \]

      \[ \sum_{i=0}^{n-1} (-1)^i u^{n-1-i} v^i \not\vdots n \text{, suy ra } u^n + v^n = (u+v) \sum_{i=0}^{n-1} (-1)^i u^{n-1-i} v^i \not\vdots n \text{, trái với giả thiết.} \]

      \[ \text{Vậy } (u+v)\vdots n \text{, theo một kết quả chứng minh ở b) là } \sum_{i=0}^{n-1} (-1)^i u^{n-1-i} v^i = A\vdots n \text{, suy ra} \]

      \[ u^n + v^n = (u+v) \sum_{i=0}^{n-1} (-1)^i u^{n-1-i} v^i \vdots n^2 \text{ (đpcm).} \]

      \[ \text{d) Vì } n \text{ là số nguyên tố và } u \not\vdots n \text{ nên } u^{n-1} \equiv 1 \pmod n \text{ (định lý nhỏ Fermat), suy ra } u^{n-1} = 1 + mn, m \in \mathbb{N}. \]

      \[ \Rightarrow u^{n(n-1)} = (u^{n-1})^n = (1+mn)^n \equiv 1 \pmod{n^2} \text{ (đpcm).} \]

      \[ \text{\textbf{Bổ đề 5 đã được chứng minh.}} \]

      \[ \text{\textbf{6. Chứng minh bổ đề 6.}} \]

      \[ \text{Vì } x=u, y=v, z=t \text{ là nghiệm của PT (1) nên ta có } u^n + v^n = t^n \quad (3) \text{, suy ra: } (u+v) \sum_{i=0}^{n-1} (-1)^i u^{n-1-i} v^i = t^n \quad (4) \text{,} \]

      \[ (t-v) \sum_{i=0}^{n-1} t^{n-1-i} v^i = u^n \quad (5), \quad (t-u) \sum_{i=0}^{n-1} t^{n-1-i} u^i = v^n \quad (6) \]

      \[ \text{Xét hai trường hợp của } t. \]

      \[ \text{\textbf{6.1. Khi } t \text{ không chia hết cho } n.} \]

      \[ \text{Ta có } (u,v) = (u,t) = (v,t) = 1 \text{ và cùng với (4), (5), (6) suy ra } (u+v) \not\vdots n \text{, } (t-v) \not\vdots n \text{ và } (t-u) \not\vdots n \text{; áp dụng bổ đề} \]
