author_steps: |
  Normalized ordered step map. The leaf is BLOCKED at S1 by F4 (Q-006); S0 is
  designed and verifiable, and no Lean is written ahead of the blocked step.

  S0 [P008-R1 l0-l1] The first congruence: the fifteen boundary sums of p. 7
     satisfy
       = a^{n(n-1)} + n a^{n(n-2)} X + (n(n-1)/2) a^{n(n-3)} X^2
         + (n(n-1)(n-2)/6) a^{n(n-4)} X^3 - (n/4) a^{n(n-5)} X^4  (mod n^{4s+2})
     for X = n^s abck, with the printed justification `vi 5s >= 4s+2, s >= 2`.
     CONTENT: the tail `sum_{i=5}^{n}` and the split's `l+j >= 5` part both vanish
     modulo n^{4s+2} unconditionally (measured, see the screen), and the remaining
     terms are replaced with their a/b-forms using the substituted equation (3) -
     so in Lean the step carries (3) as an explicit hypothesis, as (7)-(10) did.
     CLASSIFICATION: S1-pending (not the blocker).              [Lean: TODO]
  S1 [P008-R1 l2-l6] The `=>` expansion of the X^4 group into nine sums.
     CLASSIFICATION: **F4** - the `(j,l) = (2,2)` expansion's third piece is
     printed `- (n/4) sum i(i-1) ...` where the pointwise identity needs
     `+ (n(n-1)/4) sum i(i-1) ...`; the printed pieces are short by exactly
     `(n^2/4) sum i(i-1) h^{n-3-i} b^{n(i-2)} (n^s abck)^4`. Counterexample:
     n = 10, i = 2 (target 21 vs printed -29). Reproduction:
     `04-sympy/m1f7_screen.py` (exit 0 = finding reproduced, exact rationals).
     Author query: `05-feedback/queries/Q-006-p008-22-pair-short-by-n2-over-4.md`
     (OPEN, blocking).                                   [BLOCKED - no Lean]
  S2 [P008-R2 l0-R3 l4] NOT this chunk: the rest of the `=>` display (the X^3 and
     X^2 rearrangements, and the re-print of the X^1/X^0 sums), then the second
     and third `= (mod n^{4s+2})` lines at R2 l3 and R3 l5. It consumes S1's
     display, so it inherits the blocker.

  evidence: the signed region record p008.yml R1-R3 (REVIEWED); the crop
    page-008-300dpi-region-01.png read three times on 2026-09-28 (twice for the
    (2,2) pieces and their ranges, once glyph-by-glyph for the third
    coefficient); 04-sympy/m1f7_screen.py exit 0 (the tail vanishing, the
    conditional-not-unconditional verdict for the congruence, and the (2,2) gap
    equal to -(n^2/4)*sum i(i-1) at n = 13, 17). The same screen also records the
    two neighbouring facts that bound the claim: the (1,3) expansion IS
    value-preserving pointwise (so the pointwise frame is the display's own), and
    the (3,1) expansion is NOT pointwise-equal (degree 4 vs 3 in i -- an index
    shift whose convention this lane has not reconstructed), so no claim is made
    about it.
