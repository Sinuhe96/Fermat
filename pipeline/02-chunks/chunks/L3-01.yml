  S0 [p2 §3 ¶1] Set c'_1 = (a,c); there exist integers a_1, c'_2 with
    (a_1,c'_2) = 1, a = c'_1·a_1 and c = c'_1·c'_2.
  S1 [p2 §3 ¶1] From ab = c^n: c'_1·a_1·b = c'_1^n·c'_2^n.
  S2 [p2 §3 ¶1] Cancel c'_1: a_1·b = c'_1^{n-1}·c'_2^n.
  S3 [p2 §3 ¶1] Hence b ∣ c'_1^{n-1}·c'_2^n.
  S4 [p2 §3 ¶1] (c'_1,b) = 1 (do (a,b) = 1), therefore c'_2^n = k·b
    with k a nonzero integer.
  S5 [p2 §3 ¶1] From the identity a_1·b = c'_1^{n-1}·c'_2^n cancel b:
    a_1 = k·c'_1^{n-1}.
  S6 [p2 §3 ¶1] Power: a_1^n = k^n·c'_1^{n(n-1)}.
  S7 [p2 §3 ¶1] Hence k ∣ a_1^n.
  S8 [p2 §3 ¶1] And k ∣ c'_2^n.
  S9 [p2 §3 ¶2] (a_1,c'_2) = 1 ⟹ (a_1^n, c'_2^n) = 1.
  S10 [p2 §3 ¶2] k divides both powers, so |k| = 1.
  S11 [p2 §3 ¶3] With c_1 = k·c'_1, c_2 = k·c'_2 (using |k| = 1 and
    n odd): b = c_2^n, a = c_1^n, c = c_1·c_2, and (c_1,c_2) are
    coprime. ∎

