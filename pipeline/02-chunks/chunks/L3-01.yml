id: L3-01
title: "Lemma 3 — coprime a·b = c^n with n odd splits into coprime nth-power factors c = c₁·c₂"
pdf_pages: [1, 2]
kind: lemma-statement
depends_on: []
source_text: |
  [PDF p1: Lemma 3 statement]

  Bổ đề 3:
  Cho a.b = c^n, n là số nguyên dương lẻ; a,b,c ∈ ℤ* sao cho
  (a,b) = 1, khi đó tồn tại hai số nguyên khác không c1, c2
  sao cho (c1,c2) = 1, c = c1.c2, a = c1^n và b = c2^n.

  [PDF p2 §3: author's proof ("3. Chứng minh bổ đề 3")]

  Giả sử (a,c) = c'_1, khi đó tồn tại hai số nguyên a_1, c'_2 sao cho
  (a_1,c'_2) = 1 và a = c'_1 a_1, c = c'_1 c'_2. Vì ab = c^n, nên
  c'_1 a_1 b = c'_1^n c'_2^n, suy ra a_1 b = c'_1^{n-1} c'_2^n,
  suy ra b ∣ c'_1^{n-1} c'_2^n. Vì (c'_1,b) = 1 (do (a,b) = 1)
  nên c'_2^n = kb, với k là số nguyên khác không, từ đẳng thức
  a_1 b = c'_1^{n-1} c'_2^n, ta suy ra a_1 = k c'_1^{n-1},
  suy ra a_1^n = k^n c'_1^{n(n-1)}, suy ra k ∣ a_1^n và
  k ∣ c'_2^n ; vì (a_1,c'_2) = 1 nên (a_1^n, c'_2^n) = 1, từ đó
  suy ra |k| = 1.
  Vậy b = k(kb) = k c'_2^n = (k c'_2)^n = c_2^n, a = k(ka) = k c'_1^n =
  (k c'_1)^n = c_1^n, c = c_1 c_2, (vì |k| = 1, n lẻ) với c_1 = k c'_1,
  c_2 = k c'_2 nguyên tố cùng nhau.
  Bổ đề 3 đã được chứng minh.
formal_hint: |
  Hypotheses:
    a b c : ℤ, a ≠ 0, b ≠ 0, c ≠ 0          (a,b,c ∈ ℤ*)
    n : ℕ, 0 < n and Odd n                  (n là số nguyên dương lẻ)
    a * b = c ^ n                           (a.b = c^n)
    Int.gcd a b = 1                         ((a,b) = 1)
  Conclusion:
    ∃ c₁ c₂ : ℤ, c₁ ≠ 0 ∧ c₂ ≠ 0 ∧ Int.gcd c₁ c₂ = 1 ∧
      c = c₁ * c₂ ∧ a = c₁ ^ n ∧ b = c₂ ^ n
  Proof strategy (author p. 2): divide a and c by their gcd
  c'_1 = (a,c), leaving coprime (a_1, c'_2); from ab = c^n get
  a_1·b = c'_1^{n-1}·c'_2^n and b ∣ c'_1^{n-1}·c'_2^n; since
  (c'_1,b) = 1 write c'_2^n = k·b with k ≠ 0 and cancel b to get
  a_1 = k·c'_1^{n-1}; then k divides both a_1^n and c'_2^n, which are
  coprime, so |k| = 1; finally c_1 := k·c'_1, c_2 := k·c'_2 (n odd so
  k^n = k) satisfy a = c_1^n, b = c_2^n, c = c_1·c_2, (c_1,c_2) = 1.
