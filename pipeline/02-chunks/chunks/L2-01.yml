id: L2-01
title: "Lemma 2 — no-solution property lifts from exponent n to exponent nk (contrapositive proof)"
pdf_pages: [1, 2]
kind: lemma-statement
depends_on: []
source_text: |
  [PDF p1: Lemma 2 statement]

  Bổ đề 2:
     Nếu cu n ∈ ℕ, n ≥ 3, PT xⁿ + yⁿ = zⁿ vô nghiệm nguyên khác
     genom thì vơ i mọi k ∈ ℕ*, PT x^{nk} + y^{nk} = z^{nk} cũvũ vô
     nghiệm nguyên khác genom.

  [PDF p2 §2: author's proof ("2. Chứng minh bổ đề 2")]

     Giả sử tồnă să întreg dôvă k₀ sao cho PT x^{nk₀} + y^{nk₀} =
     z^{nk₀} cu nghiệm întreg khác genom x = u, y = v, z = t, khi đó
     ta cu u^{nk₀} + v^{nk₀} = t^{nk₀}  ⇔  (u^{k₀})ⁿ + (v^{k₀})ⁿ =
     (t^{k₀})ⁿ, suy ra  PT xⁿ + yⁿ = zⁿ cu nghiệm întreg khác genom
     x = u^{k₀}, y = v^{k₀}, z = t^{k₀}, dĩeñăs trái cu giã thiete.
     Bổ đề 2 đã được chứng minh.
formal_hint: |
  Hypotheses:
    n : ℕ, n ≥ 3,
    k : ℕ, k ≠ 0  (the author's "k ∈ ℕ*"),
    PT xⁿ + yⁿ = zⁿ has NO nonzero integer solution.
  Conclusion:
    PT x^{n·k} + y^{n·k} = z^{n·k} has NO nonzero integer solution.
  Proof strategy (author p. 2): contrapositive — a nonzero solution
  (u, v, t) of the nk-equation gives, via the power identity
  (uᵏ)ⁿ = u^{n·k} applied coordinate-wise, the nonzero solution
  (uᵏ, vᵏ, tᵏ) of the n-equation, contradicting the hypothesis.
transcription: manual
author_steps: |
  Normalized ordered step map — full lemma (evidence: renders
  page-001-300dpi-full.png / page-002-300dpi-full.png + text layer
  extract_pypdf.txt p.1 "Bổ đề 2:" / p.2 "2. Chứng minh bổ đề 2";
  two reads: 300 dpi render + pypdf text layer agree verbatim, incl.
  the exponent spellings nk₀ / k₀ and the ℕ* symbol).

  S0 [p2 ¶1] Assume there is a positive integer k₀ such that
    x^{nk₀} + y^{nk₀} = z^{nk₀} has the nonzero integer solution
    (u, v, t), i.e. u^{nk₀} + v^{nk₀} = t^{nk₀}.
  S1 [p2 ¶1] Display step: u^{nk₀} + v^{nk₀} = t^{nk₀} ⇔
    (u^{k₀})ⁿ + (v^{k₀})ⁿ = (t^{k₀})ⁿ — the coordinate power identity
    (uᵏ)ⁿ = u^{k·n}.
  S2 [p2 ¶1] Hence xⁿ + yⁿ = zⁿ has the nonzero integer solution
    x = u^{k₀}, y = v^{k₀}, z = t^{k₀}.
  S3 [p2 ¶1] This contradicts the hypothesis ("diễneăs trái cu giã
    thiete"); by contrapositive the statement follows. ∎

  Lean mapping (one named theorem per author step, 03-lean/L2/Basic.lean):
    S0   -> hypothesis of L2_step_S1 (the assumed solution)
    S1   -> L2_step_S1 (the power identity, forwards direction — the
           author's ⇔ is used only as ⇒ here: a solution of the
           nk-equation produces a solution of the n-equation)
    S2   -> conclusion of L2_step_S1 (nonzero solution (uᵏ, vᵏ, tᵏ))
    whole -> L2_bo_de_2 (assembly: contrapositive wrap of S0–S3)

  Classifications (per AGENTS.md F1-F4/S1) — ALL S1:
    S0+S1+S2: S1. F2 round (direction): `rw [← pow_mul]` fails — the
      pin signature is `pow_mul : a ^ (m * n) = (a ^ m) ^ n`
      (Mathlib/Algebra/Group/Pow/Monoid.lean:459); the intended
      direction (k*n exponent -> iterated) is `rw [pow_mul]`.
    S3:    S1 (assembly).
  Zero F1/F3/F4 outcomes: every author step was accepted as written.
  Formal additions (implicit side conditions only, no new mathematics):
    - The equivalence display is formalised one-directionally: the proof
      only uses ⇒ (nk-solution -> n-solution); the author's own chain
      does the same.
    - Nonzero coordinates stay nonzero after exponentiation
      (u ≠ 0 → uᵏ ≠ 0, `pow_ne_zero`).
    - `k ≠ 0` (author's k ∈ ℕ*) and `n ≥ 3` are carried in the assembly
      statement for faithfulness; neither is needed by the proof.
