source_text: |
  [PDF p5 §7]

  * Vì n là số nguyên tố lớn hơn 3 nên n \equiv \pm 1 \pmod 6
  Giả sử n \equiv -1 \pmod 6, suy ra n = 6l - 1, l \in \mathbb{N}^*. Khi đó, từ
  a^{n(n-2)} + b^{n(n-2)} - c^{n(n-2)} \equiv 0 \pmod{n^2}, ta suy ra
  a^{3n(2l-1)} + b^{3n(2l-1)} - c^{3n(2l-1)} \equiv 0 \pmod n
  \Rightarrow a^{3n(2l-1)} + a^{3n(2l-1)} + a^{3n(2l-1)} \equiv 0 \pmod{n^2}
    \text{ (vì } c^{3n} \equiv -a^{3n} \pmod{n^2}, b^{3n} \equiv a^{3n} \pmod{n^2}\text{)}
  \Rightarrow 3a^{n(n-2)} \equiv 0 \pmod{n^2}, vô lý
    \text{ (vì n là số nguyên tố lớn hơn 3 và } a^{n(n-2)} \not\equiv 0 \pmod n\text{.)}
  Vậy n \equiv 1 \pmod 6 \text{ (đpcm).}

  [PDF p30 R2, the form the main proof cites: "và n ≡ 1 (mod 6)"]
formal_hint: |
  S15: `n` prime > 3 ⇒ `n % 6 = 1 ∨ n % 6 = 5` (n is odd and 3 ∤ n).
  S16: the printed reductio — assume `n % 6 = 5` (i.e. `n = 6l−1`, so
  `n − 2 = 3(2l−1)` with `2l−1` odd); from (22') and (19), (20), the sum
  `a^{n(n−2)}+b^{n(n−2)}−c^{n(n−2)}` becomes `3·a^{n(n−2)} ≡ 0 (mod n²)`; since
  `3 < n` is prime, `3` is invertible mod n², so `n² ∣ a^{n(n−2)}`, hence
  `n ∣ a` — contradicting S0's `a ≢ 0 (mod n)`.
  S17: `n % 6 = 1`.
  Bookkeeping note: the printed line "a^{3n(2l−1)} + … ≡ 0 (mod n)" weakens to
  mod n, but the next line uses the mod-n² hypothesis (22') directly, which is
  what this chunk's S16 does; the substitution
  `b^{3n(2l−1)} ≡ a^{3n(2l−1)}` needs the mod-n² forms (19)/(20) anyway.
