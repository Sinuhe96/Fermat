  S0 [P007-R2 l0-l3] The ten remaining boundary sums in the author's factorial
     form, in the printed order: the four (n^s abck)^3 sums (pairs (2,1), (1,2),
     (3,0), (0,3)), the three (n^s abck)^2 sums ((0,2), (2,0), (1,1)), the two
     n^s abck sums ((0,1), (1,0)) and the constant sum ((0,0)).
     CLASSIFICATION: F4 - the first sum printed in the X^3 group, the pair
     (2,1), is printed without its denominator 2, so the printed inference "the
     (2,1) boundary sum is i(n-1-i)(n-2-i) h^{n-3-i} b^{n(i-1)} X^3" does not
     hold; the binomial side of the SAME paper (p. 6 R3) says the coefficient is
     i(n-1-i)(n-2-i)/2. Counterexample: at n = 13, i = 1, C(11,2) = 55 versus the
     printed 1*11*10 = 110. Reproduction: 04-sympy/m1f5_screen.py (exit 0 =
     finding reproduced). Author query: 05-feedback/queries/
     Q-005-p007-x3-sum-missing-half.md (OPEN, blocking).
     Author's own corrected print one page later: P008-R1 line 7 and P008-R3
     line 1 both carry \frac{1}{2}.
                                                            [BLOCKED - no Lean]
  S1 [P007-R2 l4-l5 / P007-R3 l0-l4] NOT this chunk: the restatement of the
     right-hand side and the `\Rightarrow` display that rearranges the X^4 sums
     (one display across the page break). It re-prints the same (2,1) sum with
     the same missing 1/2 at P007-R3 l2, so `M1-FRAG-06` inherits this blocker.
  S2+ [P008-R1 l0-l1] NOT this chunk: the first congruence step
     (mod n^{4s+2}). It prints the corrected 1/2, so it is a downstream chunk
     that does NOT inherit the blocker.

