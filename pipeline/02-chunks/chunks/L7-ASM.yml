  [PDF p1 bottom → p2 top: bổ đề 7 in full]

  Bổ đề 7:
  Nếu n là số nguyên tố lớn hơn 3 và ba số nguyên a, b, c, thỏa mãn
    abc \not\equiv 0 (\mathrm{mod}\ n),
    a^n + b^n - c^n \equiv 0 (\mathrm{mod}\ n^2),
    a^{n(n-2)} + b^{n(n-2)} - c^{n(n-2)} \equiv 0 (\mathrm{mod}\ n)
  thì ta có
    (a^n - b^n)(c^n + a^n)(c^n + b^n) \not\equiv 0 (\mathrm{mod}\ n),
    a^{n^2} + b^{n^2} - c^{n^2} \equiv 0 (\mathrm{mod}\ n^2),
    a^{n(n-3)} + b^{n(n-3)} + c^{n(n-3)} \equiv c^{3n} + b^{3n} \equiv a^{3n} - b^{3n}
      \equiv b^n c^n + a^{2n} \equiv c^n a^n + b^{2n} \equiv b^n a^n - c^{2n} \equiv 0 (\mathrm{mod}\ n^2),
    n \equiv 1 (\mathrm{mod}\ 6),
    a^{n(n-2)} + b^{n(n-2)} - c^{n(n-2)} \equiv a^{n(n-4)} + c^{n(n-4)}
      \equiv b^{n(n-4)} + c^{n(n-4)} \equiv a^{n(n-4)} - b^{n(n-4)} \equiv 0 (\mathrm{mod}\ n^2).

  Assembly contract (AGENTS.md "Section assembly"): the Lean file only imports
  the leaf modules and chains their assembly theorems in the author's order —
  no new mathematics, no re-proved steps.
