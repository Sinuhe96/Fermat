  Vision capability gap: this session could not re-read the PNG renders (image
  reads return binary; the repo's own vision-probe.png is unreadable here), so
  the render read is the human-signed region LaTeX, not a fresh independent
  vision pass — same gap as recorded in L4-01.
  Cross-layer divergences (reported, not silently resolved):
    (D1) Both engine text layers drop every ⋮ / ⋮̸ glyph (unmapped font glyph +
      vector slash, per the P001-R3/P002-R1 region notes), so NO divisibility
      direction in the statement or the proof is independently confirmable
      from the text layers. The text layers do confirm the *number* of
      conjuncts: a) reads "... , ... = 1 và ... n ." and b) "... = n và ... n² .",
      matching the signed region LaTeX; only the two glyphs themselves are
      missing.
    (D2) The b) bracket formula is scrambled in both text layers (the fractions
      C_n^k/n and (n−1)v^{n−2}/2 come out as disjoint exponent/fraction
      fragments in extract_pypdf.txt and extract_pymupdf.txt). The printed
      sign `− ((n−1)v^{n−2})/2` therefore rests on the signed region LaTeX
      plus the algebraic re-derivation in 04-sympy/test_l5_01.py, which
      confirms the sign from the k = n−2 term ((−1)^{n−2} = −1 for odd n).
    (D3) P002-R2 ends with an isolated `2` and P003-R3 with an isolated `3`:
      these are the printed page numbers (cf. P001-R4's isolated `1` and its
      "cannot be determined" vision caveat), not mathematics, and are
      excluded from source_text.
    (D4) No other divergence: statement wording, every exponent, the C_n^k
      indices, the n² moduli, `(u,v) = 1`, `u+v ≠ 0`, k = 1..n−1, and the
      closing "Bổ đề 5 đã được chứng minh." all agree across the region
      records and the text layers.

  Shared setup (statement + expansion)
  S0 [p1 statement; region P001-R3] Hypotheses: n số nguyên tố lẻ; u, v ∈ ℤ
    with (u,v) = 1. Four claims a)–d) as printed (see source_text).
  S1 [p2 §5 a); P002-R2] Definition: put A = Σ_{i=0}^{n−1} (−1)^i u^{n−1−i}v^i.
  S2 [p2 §5 a); P002-R2] Binomial expansion of the Fermat expression:
    u^n + v^n = [(u+v)−v]^n + v^n = (u+v) Σ_{k=0}^{n−1} (−1)^k C_n^k
    (u+v)^{n−1−k} v^k, i.e. u^n + v^n = (u+v)A. The k = n term of
    [(u+v)−v]^n is (−1)^n v^n = −v^n and cancels the added +v^n: n odd is
    load-bearing here.
  S3 [p2 §5 a); P002-R2] "mà u+v ≠ 0, nên A = Σ_{k=0}^{n−1} (−1)^k C_n^k
    (u+v)^{n−k−1} v^k": divide the S2 identity by u+v.
  S4 [p2 §5 a); P002-R2] Split off the last summand: A = (u+v) Σ_{k=0}^{n−2}
    (−1)^k C_n^k (u+v)^{n−k−2} v^k + nv^{n−1} (the k = n−1 term is
    (−1)^{n−1} C_n^{n−1} v^{n−1} = n v^{n−1}, n odd).
  Part a)
  S5 [p2 §5 a) → p3 §5 a); P002-R2/P003-R1] (u,v) = 1 and (u+v) ⋮̸ n give
    (u+v, v^{n−1}) = 1 and (u+v, n) = 1, hence (u+v, nv^{n−1}) = 1
    ("nên (u+v, nv^{n−1}) = 1").
  S6 [p3 §5 a); P003-R1] From S4 and S5: A ≡ nv^{n−1} (mod u+v) with
    (u+v, nv^{n−1}) = 1, so (A, u+v) = 1 — "(đpcm)" of part a).
  S7 [p1 statement a); P001-R3 — NO matching inference in the printed proof]
    The second conjunct of a): A ⋮̸ n. The a) proof text closes "(đpcm)"
    immediately after (A,u+v) = 1 and never derives A ⋮̸ n; the same mod-n
    technique appears only in c), where (u+v) ⋮̸ n and uv ⋮̸ n are assumed.
    The claim is TRUE for the lemma's hypotheses, by the c)-style mod-n
    argument: (u+v)A = u^n + v^n with (u+v) invertible mod n (a)'s own
    hypothesis, so n | A ⟺ n | u^n+v^n; now if n | uv then (say n | u)
    u^n ≡ 0 while v^n ≢ 0 mod n (FLT, n ∤ v), and if n ∤ uv then
    u^n + v^n ≡ u + v ≢ 0 mod n (FLT and (u+v) ⋮̸ n). The screen in
    04-sympy/test_l5_01.py verifies it on instances (n ∈ {3,5,7,11,13}),
    but as printed it is stated without a derivation. RED FLAG for the Lean
    lane (F3 watch-list: SHORTEST ROUTE, supplied by the integration session
    and checked numerically on 1805 instances — from S4's binomial form
    A = Σ_{k=0}^{n−1} (−1)^k C_n^k (u+v)^{n−1−k} v^k one gets
    A ≡ (u+v)^{n−1} (mod n), because C_n^k ⋮ n for 1 ≤ k ≤ n−2 (n prime) and
    the k = n−1 term is n v^{n−1}; so n | A ⟹ n | (u+v)^{n−1} ⟹ n | (u+v)
    (n prime), contradicting a)'s own hypothesis (u+v) ⋮̸ n. So a)'s second
    conjunct is an F3 derivation from the author's S4/S9 material, NOT a
    missing author assumption.) bổ đề 6 uses BOTH conjuncts of a) — see its
    "(u+v, Σ…) = … = 1, (Σ…) ⋮̸ n, …" in P003-R3.
  Part b)
  S8 [p3 §5 b); P003-R1] Algebraic refinement: A = n(u+v)[Σ_{k=0}^{n−3}
    (−1)^k (C_n^k/n)(u+v)^{n−k−2} v^k − ((n−1)v^{n−2})/2] + nv^{n−1}
    = n(u+v)A_1 + nv^{n−1}, with that bracket named A_1. (The bracket's
    second term is the k = n−2 term of the S3 sum, n·(−1)^{n−2}(C_n^{n−2}/n)
    v^{n−2} = −n((n−1)/2)v^{n−2} for odd n.)
  S9 [p3 §5 b); P003-R1] For k = 1,…,n−1, C_n^k ⋮ n because n is prime; with
    (u+v) ⋮ n this gives n(u+v)A_1 ⋮ n².
  S10 [p3 §5 b); P003-R1] nv^{n−1} ⋮ n, and nv^{n−1} ⋮̸ n² because v ⋮̸ n
    (n | u+v together with (u,v) = 1 forces n ∤ v).
  S11 [p3 §5 b); P003-R1] Therefore A = n(u+v)A_1 + nv^{n−1} ⋮ n and
    A ⋮̸ n² (A ≡ nv^{n−1} mod n² with n² ∤ nv^{n−1}), and
    (u+v, A) = (u+v, nv^{n−1}) = (u+v, n) = n — "(đpcm)" of part b).
  Part c) — case split on uv ⋮ n
  S12 [p3 §5 c) branch 1; P003-R1] uv ⋮ n ⟹ (u ⋮ n) ∨ (v ⋮ n) (n prime);
    with (u^n+v^n) ⋮ n both u^n ⋮ n and v^n ⋮ n, hence u ⋮ n ∧ v ⋮ n
    (n prime), hence (u^n+v^n) ⋮ n². (No use of (u,v) = 1.)
  S13 [p3 §5 c) branch 2; P003-R2] uv ⋮̸ n ⟹ u ⋮̸ n and v ⋮̸ n, so Fermat's
    little theorem gives u^{n−1} ≡ v^{n−1} ≡ 1 (mod n), hence
    u^{n−1} − v^{n−1} = (u^{n−1}−1) − (v^{n−1}−1) ≡ 0 (mod n).
  S14 [p3 §5 c) branch 2; P003-R2] Identity:
    Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i = u^{n−1} − v Σ_{i=0}^{n−2} (−1)^i
    u^{n−2−i} v^i = u^{n−1} − v(u^{n−1} − v^{n−1})/(u+v).
  S15 [p3 §5 c) branch 2; P003-R2] Suppose (u+v) ⋮̸ n: then (u+v) is
    invertible mod n, so S13+S14 give A ≡ u^{n−1} ≡ 1 (mod n); hence
    A ⋮̸ n, hence u^n+v^n = (u+v)A ⋮̸ n (n prime), contradicting the
    hypothesis (u^n+v^n) ⋮ n. So (u+v) ⋮ n.
  S16 [p3 §5 c); P003-R2] With (u+v) ⋮ n, "theo một kết quả chứng minh ở b)"
    gives A ⋮ n, hence u^n+v^n = (u+v)A ⋮ n² — "(đpcm)" of part c). (Cites
    part b) of this same lemma, not another bổ đề; note that only b)'s
    "A ⋮ n" half is quoted, and that half follows from S4 without
    (u,v) = 1, which is why c)'s parenthetical is sound.)
  Part d)
  S17 [p3 §5 d); P003-R2] n prime and u ⋮̸ n ⟹ u^{n−1} ≡ 1 (mod n) (Fermat),
    so u^{n−1} = 1 + mn with m ∈ ℕ.
  S18 [p3 §5 d); P003-R2] u^{n(n−1)} = (u^{n−1})^n = (1+mn)^n ≡ 1 (mod n²)
    — every term of (1+mn)^n beyond the first is divisible by n².
    "Bổ đề 5 đã được chứng minh." ∎

