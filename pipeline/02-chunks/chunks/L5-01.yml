id: L5-01
title: "Lemma 5 — the alternating sum A = Σ(–1)^i u^{n−1−i} v^i: gcd(A, u+v), its n-adic position, and Fermat mod n² (full lemma, parts a–d)"
pdf_pages: [1, 2, 3]
kind: lemma-statement
depends_on: []
source_text: |
  [PDF p1: Lemma 5 statement — region P001-R3]

  Bổ đề 5:
  Cho n là số nguyên tố lẻ và hai số nguyên u, v sao cho (u,v) = 1, khi đó:
  a) Nếu (u+v) ⋮̸ n thì (u+v, Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i) = 1
     và (Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i) ⋮̸ n.
  b) Nếu (u+v) ⋮ n thì (u+v, Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i) = n
     và (Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i) ⋮̸ n².
  c) Nếu (u^n + v^n) ⋮ n thì (u^n + v^n) ⋮ n² (không cần giả thiết (u,v) = 1).
  d) Nếu u ⋮̸ n thì u^{n(n−1)} ≡ 1 (mod n²).

  [PDF p2 §5: author's proof ("5. Chứng minh bổ đề 5"), part a) — head, to the
  page break — region P002-R2]

  5. Chứng minh bổ đề 5
  a) Đặt A = Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i. Ta có u^n + v^n = [(u+v)−v]^n + v^n
  = (u+v) Σ_{k=0}^{n−1} (−1)^k C_n^k (u+v)^{n−1−k} v^k, u^n + v^n = (u+v)A mà
  u+v ≠ 0, nên A = Σ_{k=0}^{n−1} (−1)^k C_n^k (u+v)^{n−k−1} v^k. Ta có
  A = (u+v) Σ_{k=0}^{n−2} (−1)^k C_n^k (u+v)^{n−k−2} v^k + nv^{n−1}, (u,v) = 1 và
  (u+v) ⋮̸ n

  [PDF p3 §5: part a) tail, whole b), head of c) — region P003-R1]

  nên (u+v, nv^{n−1}) = 1, suy ra (A,u+v) = 1 (đpcm).
  b) Ta có A = n(u+v) [ Σ_{k=0}^{n−3} (−1)^k (C_n^k/n)(u+v)^{n−k−2} v^k
     − ((n−1)v^{n−2})/2 ] + nv^{n−1} = n(u+v)A_1 + nv^{n−1}, với
  Σ_{k=0}^{n−3} (−1)^k (C_n^k/n)(u+v)^{n−k−2} v^k − ((n−1)v^{n−2})/2 = A_1.
  Với k = 1,…,n−1 (printed k = 1̄,n−1̄) thì C_n^k ⋮ n (vì n là số nguyên tố),
  mà (u+v) ⋮ n nên
  n(u+v)A_1 ⋮ n²; mặt khác nv^{n−1} ⋮ n và nv^{n−1} ⋮̸ n² (do v ⋮̸ n), từ đó
  suy ra n(u+v)A_1 + nv^{n−1} = A ⋮ n và A ⋮̸ n², hơn nữa (u+v,A) = n (đpcm).
  c) * Nếu uv ⋮ n thì u ⋮ n ∨ v ⋮ n (vì n là số nguyên tố), suy ra
  u^n ⋮ n ∨ v^n ⋮ n và do (u^n+v^n) ⋮ n nên u^n ⋮ n ∧ v^n ⋮ n, suy ra
  u ⋮ n ∧ v ⋮ n (vì n là số nguyên tố), suy ra (u^n+v^n) ⋮ n² (đpcm).

  [PDF p3 §5: rest of c), d), closing line — region P003-R2]

  * Nếu uv ⋮̸ n thì u ⋮̸ n, v ⋮̸ n, suy ra u^{n−1} ≡ v^{n−1} ≡ 1 (mod n)
  (định lý nhỏ Fermat) suy ra u^{n−1} − v^{n−1} = (u^{n−1} − 1) − (v^{n−1} − 1)
  ≡ 0 (mod n).
  Giả sử (u+v) ⋮̸ n, ta có
  Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i = u^{n−1} − v Σ_{i=0}^{n−2} (−1)^i u^{n−2−i} v^i
  = u^{n−1} − v(u^{n−1} − v^{n−1})/(u+v) ≡ u^{n−1} ≡ 1 (mod n), suy ra
  Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i ⋮̸ n, suy ra
  u^n + v^n = (u+v) Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i ⋮̸ n, trái với giả thiết.
  Vậy (u+v) ⋮ n, theo một kết quả chứng minh ở b) là
  Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i = A ⋮ n, suy ra
  u^n + v^n = (u+v) Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i ⋮ n² (đpcm).
  d) Vì n là số nguyên tố và u ⋮̸ n nên u^{n−1} ≡ 1 (mod n) (định lý nhỏ Fermat),
  suy ra u^{n−1} = 1 + mn, m ∈ ℕ.
  ⇒ u^{n(n−1)} = (u^{n−1})^n = (1+mn)^n ≡ 1 (mod n²) (đpcm).
  Bổ đề 5 đã được chứng minh.

  [Notation as printed: the Vietnamese divisibility glyph ⋮ ("a ⋮ b" = "a chia
  hết cho b" = b | a; argument order flips, see ENCODING_MAP §A) and its
  vector-slash form ⋮̸ ("không chia hết cho"). (a,b) is the gcd, ℤ* the nonzero
  integers, C_n^k the binomial coefficient (upper index n, lower index k),
  printed `k = 1̄,n−1̄` means 1 ≤ k ≤ n−1. Page numbers 2 (p2) and 3 (p3) are
  printed numerals at the foot of the page and are not transcribed here — cf.
  P001-R4's isolated `1` and its vision caveat.]
formal_hint: |
  Shared hypotheses of the Lean statement:
    n : ℕ, Nat.Prime n, and n odd (`Nat.Prime n` plus `n ≠ 2` gives `Odd n`;
    per ENCODING_MAP §A, `Nat.Prime.eq_two_or_odd` yields `n % 2 = 1`, not
    `Odd n`, so the oddness must be derived/asserted explicitly);
    u v : ℤ with (u,v) = 1, i.e. Int.gcd u v = 1 (ℕ-valued!);
    A := ∑ i ∈ Finset.range n, (-1 : ℤ) ^ i * u ^ (n - 1 - i) * v ^ i
        (the author's A = Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i; the statement
        spells the sum out inline, the proof abbreviates it as A).

  a) ¬ ((n : ℤ) ∣ (u + v))  ⟹
       (Int.gcd (u + v) A : ℤ) = 1 ∧ ¬ ((n : ℤ) ∣ A)
  b) (n : ℤ) ∣ (u + v)  ⟹
       (Int.gcd (u + v) A : ℤ) = n ∧ ¬ ((n : ℤ) ^ 2 ∣ A)
  c) (n : ℤ) ∣ u ^ n + v ^ n  ⟹  (n : ℤ) ^ 2 ∣ u ^ n + v ^ n
     — the parenthetical "(không cần giả thiết (u,v) = 1)" means the Lean
     statement for c) must NOT carry `Int.gcd u v = 1`.
  d) ¬ ((n : ℤ) ∣ u)  ⟹  u ^ (n * (n - 1)) ≡ 1 [ZMOD (n : ℤ) ^ 2]

  Notation bridge: `(a,b) = m` is `Int.gcd a b` compared after a cast (the
  paper's gcd is ℕ-valued in Mathlib); `⋮` is `∣` with the printed argument
  order flipped (ENCODING_MAP §A); `≡ · (mod n²)` is
  `Int.ModEq ((n:ℤ)^2) …` / `· ≡ · [ZMOD (n:ℤ)^2]`
  (MATHLIB_API_LESSONS §Int.ModEq); the sum is a `Finset.sum` over
  `Finset.range n` with `(-1 : ℤ) ^ i`; `u^{n(n−1)}` is `u ^ (n * (n - 1))`.

  Where the hypotheses are load-bearing (Lean-side, all author-supplied):
    * n odd is used in the shared expansion — the k = n term of
      [(u+v)−v]^n cancels +v^n only because (−1)^n = −1 — and in the b)
      bracket, where the k = n−2 term is (−1)^{n−2}·C_n^{n−2}·v^{n−2}
      = −n·((n−1)/2)·v^{n−2} (n−2 odd).
    * n prime is used for: gcd(u+v, n) = 1 from ¬(n ∣ u+v) — note this is
      an equivalence only for n prime; C_n^k/n ∈ ℤ for 1 ≤ k ≤ n−1; and
      the step "n | u^n+v^n and n | u+v ⟹ n² | u^n+v^n" plus the mod-n
      contradiction in c).
    * (u,v) = 1 is used for gcd(u+v, v^{n−1}) = 1 (hence a)'s
      (u+v, nv^{n−1}) = 1 and b)'s derivation of v ⋮̸ n from n | u+v),
      and for b)'s "(u+v, A) = n". It is NOT used in c).
    * a)'s printed division by (u+v) assumes u+v ≠ 0 ("mà u+v ≠ 0, nên
      A = (u^n+v^n)/(u+v)"); u+v ≠ 0 is not among the author's hypotheses
      (a)'s own hypothesis (u+v) ⋮̸ n excludes it, but b)–d) do not). The
      identity A = Σ_{k} (−1)^k C_n^k (u+v)^{n−1−k} v^k also holds without
      dividing (verified symbolically), so the Lean lane should prove it
      as a polynomial identity rather than by division.
    - d)'s intermediate u^{n−1} = 1 + mn needs m ≥ 0; available because
      n − 1 is even and u ≠ 0 gives u^{n−1} ≥ 1.
    - d) ROUTE (raised by the L4-01 lane 2026-09-26, cross-checked against
      the print): the AUTHOR's own derivation is FLT mod n
      (u^{n−1} ≡ 1 mod n, "định lý nhỏ Fermat") → u^{n−1} = 1 + mn → then
      the binomial u^{n(n−1)} = (1+mn)^n ≡ 1 mod n² (every term beyond the
      first carries n^j, j ≥ 1). Encode THAT chain. The Euler alternative
      (φ(n²) = n(n−1), i.e. u is a unit of ZMod (n²) and
      g^{card G} = 1 / Nat.totient_prime_pow_succ, with
      ZMod.isUnit_natCast_iff_not_dvd_pow converting u ⋮̸ n into a unit)
      reaches the same conclusion by a DIFFERENT route and must not
      substitute the author's step (AGENTS.md core rule); it is a
      documented fallback only if the author's route hits a Mathlib wall,
      and using it then needs an explicit deviation note in the chunk.
      Note the tool split: `ZMod.pow_card_sub_one_eq_one` /
      `Int.prime_dvd_pow_sub_one` is the RIGHT tool for the author's FIRST
      half (mod n, exponent n−1) and the WRONG one for the final modulus —
      d)'s modulus is n², exponent n(n−1). Candidate bridge for the ℤ form
      u^{n−1} = 1 + mn: `Int.modEq_iff_add_fac` (probe it).
