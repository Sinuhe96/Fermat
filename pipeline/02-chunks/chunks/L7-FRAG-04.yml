source_text: |
  [PDF p5 §7, the two bullets after the non-divisibility "(đpcm)"]

  * Vì c^n + b^n \not\equiv 0 \pmod n, b^{3n} + c^{3n} = (b^n + c^n)[(c^n - b^n)^2 + b^n c^n]
    \equiv (b^n + c^n)(a^{2n} + b^n c^n) \equiv 0 \pmod{n^2} nên a^{2n} + b^n c^n \equiv 0 \pmod{n^2}

  Chứng minh tương tự ta cũng có b^{2n} + a^n c^n \equiv c^{2n} - a^n b^n \equiv 0 \pmod{n^2}.

  * Ta có c^{2n} - a^n b^n \equiv 0 \pmod{n^2}
  \Rightarrow c^n (a^n + b^n) - a^n b^n \equiv 0 \pmod{n^2} \text{ (vì } a^n + b^n \equiv c^n \pmod{n^2}\text{)}
  \Rightarrow c^n a^n . 1 + c^n b^n . 1 - a^n b^n . 1 \equiv 0 \pmod{n^2}
  \Rightarrow c^n a^n b^{n(n-1)} + c^n b^n a^{n(n-1)} - a^n b^n c^{n(n-1)} \equiv 0 \pmod{n^2}
    \text{ (theo bổ đề 5 d)), ta có } a^{n(n-1)} \equiv b^{n(n-1)} \equiv c^{n(n-1)} \equiv 1 \pmod{n^2}\text{)}
  \Rightarrow b^{n(n-2)} + a^{n(n-2)} - c^{n(n-2)} \equiv 0 \pmod{n^2} \text{ (đpcm).}

  [PDF p30 R2, the numbered forms the main proof cites]
  c^n b^n + a^{2n} \equiv c^n a^n + b^{2n} \equiv b^n a^n - c^{2n} \equiv 0 (\mathrm{mod}\ n^2)\ (18)
  a^{n(n-2)} + b^{n(n-2)} - c^{n(n-2)} \equiv 0 (\mathrm{mod}\ n^2)\ (22')
formal_hint: |
  S12: from (19) `b^{3n}+c^{3n} ≡ 0 [ZMOD n²]`, (b) and `n ∤ b^n+c^n`, factor
  `b^{3n}+c^{3n} = (b^n+c^n)((c^n−b^n)²+b^nc^n)`, replace `(c^n−b^n)²` by `a^{2n}`
  (it is `(c^n−b^n) ≡ a^n` squared) and cancel the factor `b^n+c^n`, which is
  invertible mod n² because it is ≢ 0 mod n.
  S13: the same argument with `(b; c)` replaced by `(a; c)` gives
  `b^{2n}+a^nc^n ≡ 0`, and the difference form `a^{3n}−b^{3n} = (a^n−b^n)(a^{2n}+a^nb^n+b^{2n})`
  with `a^n−b^n ≢ 0 (mod n)` gives `a^{2n}+a^nb^n+b^{2n} ≡ 0`, which is
  `c^{2n}−a^nb^n` because `c^{2n} ≡ (a^n+b^n)²` — the printed "tương tự".
  S14: the printed derivation of (22') from `c^{2n}−a^nb^n ≡ 0`, using (b) to
  turn `c^{2n}` into `c^n(a^n+b^n)`, then 5d to raise each factor, and
  cancelling `a^nb^nc^n` (invertible mod n²).
