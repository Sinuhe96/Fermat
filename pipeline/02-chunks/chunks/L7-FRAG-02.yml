source_text: |
  [PDF p2 top: bổ đề 7's remaining conclusions (statement)]
  a^{n^2} + b^{n^2} - c^{n^2} \equiv 0(\mathrm{mod}\ n^2), a^{n(n-3)} + b^{n(n-3)} + c^{n(n-3)}
  \equiv c^{3n} + b^{3n} \equiv a^{3n} - b^{3n} \equiv b^n c^n + a^{2n} \equiv c^n a^n + b^{2n}
  \equiv b^n a^n - c^{2n} \equiv 0(\mathrm{mod}\ n^2), n \equiv 1(\mathrm{mod}6)
  a^{n(n-2)} + b^{n(n-2)} - c^{n(n-2)} \equiv a^{n(n-4)} + c^{n(n-4)} \equiv b^{n(n-4)} + c^{n(n-4)}
  \equiv a^{n(n-4)} - b^{n(n-4)} \equiv 0 (\mathrm{mod}\ n^2).

  [PDF p4 bottom: "7. Chứng minh bổ đề 7", opening bullet]
  * Vì abc \not\vdots n, nên a \not\vdots n, b \not\vdots n, c \not\vdots n, vì vậy theo bổ đề 5d), ta có:
  c^{n(n-1)} \equiv a^{n(n-1)} \equiv b^{n(n-1)} \equiv 1 \pmod{n^2}, suy ra
  a^{n^2} + b^{n^2} - c^{n^2} = (a^n + b^n - c^n) - c^n [c^{n(n-1)} - 1] + a^n [a^{n(n-1)} - 1] + b^n [b^{n(n-1)} - 1] \equiv 0 \pmod{n^2}

  [PDF p4 §7 → p5 §7]
  \Rightarrow a^{n^2} + b^{n^2} - c^{n^2} \equiv 0 \pmod{n^2} \text{ (a).}
  * Ta có c^n \equiv a^n + b^n \pmod{n^2} \text{ (b) và } c^{n(n-2)} \equiv a^{n(n-2)} + b^{n(n-2)} \pmod{n} \text{ (c). Từ (c) suy ra}
  c^{n(n-1)} a^n b^n \equiv a^{n(n-1)} c^n b^n + b^{n(n-1)} c^n a^n \pmod{n}
    \text{(nhân hai vế của đồng dư thức (c) cho } a^n b^n c^n \not\equiv 0 \pmod n\text{)}
  \Rightarrow a^n b^n \equiv c^n (a^n + b^n) \pmod{n}
  \Rightarrow a^n b^n \equiv c^{2n} \pmod n \text{ (d) (vì } a^n + b^n \equiv c^n \pmod{n^2}\text{)}
formal_hint: |
  Hypotheses (bổ đề 7's, unchanged):
    n prime > 3, integers a b c with n ∤ a*b*c,
    GT2: a^n + b^n - c^n ≡ 0 [ZMOD n^2],
    GT3: a^{n(n−2)} + b^{n(n−2)} - c^{n(n−2)} ≡ 0 [ZMOD n].
  Conclusion of this chunk — the author's displays (a)–(d):
    S0: a^{n(n−1)} ≡ b^{n(n−1)} ≡ c^{n(n−1)} ≡ 1 [ZMOD n^2]   (bổ đề 5d at a, b, c)
    S1: (a) a^{n^2} + b^{n^2} - c^{n^2} ≡ 0 [ZMOD n^2]
    S2: (b) c^n ≡ a^n + b^n [ZMOD n^2]  and  (c) c^{n(n−2)} ≡ a^{n(n−2)} + b^{n(n−2)} [ZMOD n]
    S3: the multiplication of (c) by a^n b^n c^n, after 5d: a^n b^n ≡ c^n (a^n + b^n) [ZMOD n]
    S4: (d) a^n b^n ≡ c^{2n} [ZMOD n]
  Modulus spelling: `(n^2 : ℤ)` and the `(↑n)^2` that bổ đề 5's statements
  display are the same term (the ascription takes the power in ℤ), so no cast
  bridge is needed between the two chunks.
