  S0 [p1 statement] Hypotheses: n ∈ ℕ positive odd; a,b,c,m ∈ ℤ*;
    |a| ≥ 2, |b| ≥ 2, |c| ≥ 2; m prime; (a,b) = m; a·b = c^n;
    b ⋮̸ m² (m² ∤ b).
  S1 [p2 ¶1] (a,b) = m gives m | a and m | b; with a·b = c^n this gives
    m² | a·b = c^n, i.e. c^n ⋮ m².
  S2 [p2 ¶1] m prime and m² | c^n ⟹ m | c ("suy ra c ⋮ m (do m là số
    nguyên tố)").
  S3 [p2 ¶1] Write c = m^s·r with s ∈ ℕ*, r ∈ ℤ*, r ⋮̸ m (the m-adic
    decomposition of c, available since m | c and m prime). From
    c^n = m^{ns}·r^n ⋮ m² and m ∤ r deduce ns ≥ 2.
  S4 [p2 ¶2] From (a,b) = m and b ⋮̸ m²: b = m·h and a = m^k·l, with
    k ∈ ℕ*, h,l ∈ ℤ*, (h,l) = 1, h ⋮̸ m, l ⋮̸ m. (b carries exactly one
    factor of m because m² ∤ b; coprimality of h,l is inherited from
    (a,b) = m.)
  S5 [p2 ¶3] Substitute: a·b = m^{k+1}·h·l = c^n = m^{ns}·r^n. Since m
    is prime and m ∤ h·l·r, the m-adic valuations must match: k+1 = ns,
    hence k = ns−1, and cancelling m^{ns} gives h·l = r^n.
  S6 [p2 ¶3] Apply bổ đề 3 to h·l = r^n (n odd, (h,l) = 1): there exist
    c₁, c₂ ∈ ℤ* with (c₁,c₂) = 1, r = c₁·c₂, h = c₁^n, l = c₂^n.
  S7 [p2 ¶4] Assemble: c = m^s·c₁·c₂, a = m^{ns−1}·c₂^n, b = m·c₁^n.
    The statement's extra conclusions c₁ ⋮̸ m and c₂ ⋮̸ m follow from
    h = c₁^n, l = c₂^n together with h,l ⋮̸ m and m prime. ∎

