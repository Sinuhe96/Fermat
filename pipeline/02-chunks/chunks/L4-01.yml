  Implicit side conditions identified while transcribing (F3 watch-list
  for the Lean lane, all supplied by the author's own hypotheses):
    - S2 needs m prime (m² | c^n does not give m | c for composite m).
    - S3 needs m | c (from S2) and c ≠ 0 for the decomposition, and
      s ≥ 1 (author's s ∈ ℕ*).
    - S5 needs m prime AND m ∤ h·l·r: the exponent comparison k+1 = ns
      is exactly where coprimality is load-bearing.
    - S6 needs n odd (bổ đề 3's hypothesis) and (h,l) = 1 (from S4).
    - S7 needs m ∤ h, m ∤ l (from S4) to conclude c₁, c₂ ⋮̸ m.

