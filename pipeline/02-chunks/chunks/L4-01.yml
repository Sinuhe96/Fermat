id: L4-01
title: "Lemma 4 — m-adic structure of the factorisation ab = c^n when (a,b) = m and m^2 ∤ b (full lemma)"
pdf_pages: [1, 2]
kind: lemma-statement
depends_on: [L3-01]
source_text: |
  [PDF p1: Lemma 4 statement — spans regions P001-R2 (tail) and P001-R3 (head)]

  Bổ đề 4:
  Cho a.b = c^n, n là số nguyên dương lẻ, a,b,c,m ∈ ℤ*, sao cho
  |a| ≥ 2, |b| ≥ 2, |c| ≥ 2, m là số nguyên tố, (a,b) = m,
  b ⋮̸ m², khi đó tồn tại số nguyên dương s sao cho ns ≥ 2 và hai số
  nguyên khác không c₁, c₂ sao cho (c₁,c₂) = 1 đồng thời c₁ ⋮̸ m,
  c₂ ⋮̸ m, c = m^s c₁.c₂, a = m^{ns−1} c₂^n và b = m c₁^n.

  [PDF p2 §4: author's proof ("4. Chứng minh bổ đề 4") — region P002-R2]

  4. Chứng minh bổ đề 4
  Vì a ⋮ m, b ⋮ m và a.b = c^n, suy ra c^n ⋮ m², suy ra c ⋮ m (do m
  là số nguyên tố). Giả sử c = m^s r, với s ∈ ℕ*, r ∈ ℤ* và r ⋮̸ m,
  mà c^n = m^{ns} r^n ⋮ m², nên ns ≥ 2.
  Do (a,b) = m và b ⋮̸ m², nên có thể giả sử b = mh và a = m^k l, với
  k ∈ ℕ*; h,l ∈ ℤ* sao cho (h,l) = 1, h ⋮̸ m, l ⋮̸ m.
  Vì a.b = c^n nên m^{k+1} hl = m^{ns} r^n, suy ra k+1 = ns, suy ra
  k = ns−1 và hl = r^n
  ; áp dụng bổ đề 3, ta có r = c₁.c₂, h = c₁^n, l = c₂^n, trong đó
  hai số c₁, c₂ là hai số nguyên sao cho (c₁,c₂) = 1. Từ đó
  ta có c = m^s c₁.c₂, a = m^{ns−1} c₂^n, b = m c₁^n.
  Bổ đề 4 đã được chứng minh.

  [Notation as printed: the Vietnamese divisibility glyph ⋮ is read
  "a ⋮ b" = "a chia hết cho b" = b | a (argument order flips, see
  ENCODING_MAP §A); ⋮̸ is the same glyph with a vector slash. a.b
  denotes the product a·b. ℤ* = nonzero integers.]
formal_hint: |
  Hypotheses:
    n : ℕ, n positive and odd ("số nguyên dương lẻ");
    a b c m : ℤ, all nonzero; |a| ≥ 2, |b| ≥ 2, |c| ≥ 2;
    m prime (Nat.Prime m);
    (a,b) = m          i.e. Int.gcd a b = m;
    a * b = c ^ n;
    m² ∤ b             i.e. ¬ ((m : ℤ) ^ 2 ∣ b).
  Conclusion:
    ∃ s : ℕ, ∃ c₁ c₂ : ℤ,
      s ≥ 1 ∧ n * s ≥ 2 ∧ c₁ ≠ 0 ∧ c₂ ≠ 0 ∧ Int.gcd c₁ c₂ = 1 ∧
      ¬ ((m : ℤ) ∣ c₁) ∧ ¬ ((m : ℤ) ∣ c₂) ∧
      c = (m : ℤ) ^ s * (c₁ * c₂) ∧
      a = (m : ℤ) ^ (n * s - 1) * c₂ ^ n ∧
      b = (m : ℤ) * c₁ ^ n
  Reading: with (a,b) = m the prime m splits between a and b; b carries
  exactly one factor of m, a carries the remaining ns−1, and the coprime
  part of c returns as the n-th powers c₁^n, c₂^n (via bổ đề 3).
