author_steps: |
  Normalized ordered step map (5 steps, matching the count in M1_LANE.md §5).
  One printed display line that states a new relation = one step.

  S0 [P006-R1, first sentence + "áp dụng bổ đề 1"]
     Input:  n prime, n > 11; ∃ nonzero integers x=u, y=v, z=t solving (1).
     Output: u, v, t nonzero, (u,v) = (u,t) = (v,t) = 1, u^n + v^n = t^n (3).
     Cited:  bổ đề 1 -> L1.L1_bo_de_1 (chunk L1-01, DONE).
     Lean:   M1F1_step_S0_reduce  [PENDING - not yet written]

  S1 [P006-R1, "Vì n lẻ ... (-t)^n + v^n = (-u)^n <=> u^n + (-t)^n = (-v)^n"]
     Statement: for odd n and integers u, v, t:
       u^n + v^n = t^n  <=>  v^n + u^n = t^n  <=>  (-t)^n + v^n = (-u)^n
                        <=>  u^n + (-t)^n = (-v)^n.
     This is the printed licence for the WLOG step; it does not assert that the
     roles are interchangeable in (3) beyond these identities.
     Lean:   M1F1_step_S1_symmetry  [PENDING - not yet written]

  S2 [P006-R1, "không mất tính tổng quát ta giả sử u ∤ n, v ∤ n"]
     WLOG choice. NOT a declaration; carried as hypotheses (see formal_hint).

  S3 [P006-R1, "áp dụng bổ đề 6, ta có: ..."]
     Input:  S0's output, S2's two non-divisibilities, n prime, n odd.
     Output: ∃ a b c k h, ∃ s >= 2, the six pairwise coprimalities among a,b,c,
             the three coprimalities with k, the four non-divisibilities
             (a, b, c, k vs n), and
               v = a^n + n^s abck,  u = b^n + n^s abck,  t = h - n^s abck,
               a^n + b^n = h - 2 n^s abck,  with h = c^n or h = n^{ns-1} c^n.
     Cited:  bổ đề 6 -> L6.L6_bo_de_6 (chunk L6-01, DONE).
     Lean:   M1F1_step_S3_bo_de_6  [WRITTEN; round 2]

  S4 [P006-R1, last display]
     (3) with S3 substituted: (a^n + n^s abck)^n + (b^n + n^s abck)^n
       = (h - n^s abck)^n, then its expansion to the printed alternating sum
       h^n - a^{n^2} - b^{n^2} - n[a^{n(n-1)}+b^{n(n-1)}+h^{n-1}] n^s abck
       - n(n-1)/2 [b^{n(n-2)}+a^{n(n-2)}-h^{n-2}] (n^s abck)^2 - ... = 0.
     Lean:   M1F1_step_S4_expand  [PENDING - not yet written]

