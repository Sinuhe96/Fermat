source_text: |
  [PDF p6, region P006-R1 (the opening of section "D. CHỨNG MINH ĐỊNH LÝ LỚN
  FERMAT", subsection "1. Khi n là số nguyên tố lớn hơn 11"). Byte-copied from
  the signed region record pipeline/01-extract/regions/p006.yml
  (status REVIEWED, signed_on 2026-09-26,
  signed_latex_sha256 897dc39bd1662fa3fbccac315b18daa277d7fdd3753a91e0c2e3bc8d39c60795).]
      \[ \text{\textbf{D. CHỨNG MINH ĐỊNH LÝ LỚN FERMAT}} \]

      \[ \text{\textbf{1. Khi }} n \text{\textbf{ là số nguyên tố lớn hơn 11}} \]

      \[ \text{Giả sử có số nguyên tố } n \text{ lớn hơn 11, sao cho PT (1) có nghiệm nguyên khác không } x = u,\ y = v,\ z = t, \text{ trong đó } (u,v) = (u,t) = (v,t) = 1 \text{ (áp dụng \textbf{bổ đề 1}). Khi đó } u^n + v^n = t^n \text{ (3). Vì } n \text{ lẻ và } u, v, t \text{ là các số nguyên, nên } u^n + v^n = t^n \iff v^n + u^n = t^n \iff (-t)^n + v^n = (-u)^n \iff u^n + (-t)^n = (-v)^n \text{; do đó, tính chất số học và vai trò của } u, v, t \text{ là như nhau; cho nên, không mất tính tổng quát ta giả sử } u \nmid n,\ v \nmid n, \text{ áp dụng \textbf{bổ đề 6}, ta có: } v = a^n + n^s abck,\ u = b^n + n^s abck,\ t = h - n^s abck,\ a^n + b^n = h - 2n^s abck \text{; với } (h = c^n, \text{ khi } t \nmid n) \vee (h = n^{ns-1}c^n, \text{ khi } t : n), \text{ trong đó } a, b, c, k \text{ là bốn số nguyên khác không và đôi một nguyên tố cùng nhau, đồng thời không chia hết cho } n,\ s \in \mathbb{Z},\ s \ge 2. \]

      \[ \text{Ta có: } (3) \Rightarrow (a^n + n^s abck)^n + (b^n + n^s abck)^n = (h - n^s abck)^n \]

      \[ \iff h^n - a^{n^2} - b^{n^2} - n[a^{n(n-1)} + b^{n(n-1)} + h^{n-1}]n^s abck - \frac{n(n-1)}{2}[b^{n(n-2)} + a^{n(n-2)} - h^{n-2}](n^s abck)^2 - \]

      \[ - \frac{n(n-1)(n-2)}{6}[a^{n(n-3)} + b^{n(n-3)} + h^{n-3}](n^s abck)^3 - \frac{n(n-1)(n-2)(n-3)}{24}[b^{n(n-4)} + a^{n(n-4)} - h^{n-4}](n^s abck)^4 - \]

      \[ - \ldots - n(a^n + b^n - h)(n^s abck)^{n-1} - 3(n^s abck)^n = 0, \text{ suy ra} \]
formal_hint: |
  P006-R1 is pure setup: no new label is introduced, no lemma is proved. It
  consumes two DONE entries and produces the data every later leaf on pp. 6-8
  is stated over.

  Chain, in the printed order:
    S0  hypothesis "there is a prime n > 11 with a nonzero integer solution of
        (1)" + "áp dụng bổ đề 1"  ->  pairwise-coprime u, v, t with
        u^n + v^n = t^n  (labelled "(3)" in the print).
    S1  "vì n lẻ ... u^n+v^n = t^n <=> v^n+u^n = t^n <=> (-t)^n+v^n = (-u)^n
        <=> u^n+(-t)^n = (-v)^n; do đó tính chất số học và vai trò của u, v, t
        là như nhau" - the four equivalent forms, i.e. the statement of the
        symmetry that licenses S2. The sign step is `Odd.neg_pow`: n odd makes
        (-x)^n = -(x^n), which is what turns the left-hand side into the right.
    S2  "không mất tính tổng quát ta giả sử u ∤ n, v ∤ n" - the WLOG choice.
        This is a CHOICE, not a derivable claim: nothing in the print excludes a
        solution with n | u; the author uses S1 to pick the coordinate naming.
        It is therefore NOT a theorem. In Lean it is carried as the two
        hypotheses `hnu : ¬ (n : ℤ) ∣ u`, `hnv : ¬ (n : ℤ) ∣ v` of the steps
        that follow, exactly as the print carries it as an assumption.
    S3  "áp dụng bổ đề 6, ta có: v = a^n + n^s abck, u = b^n + n^s abck,
        t = h - n^s abck, a^n + b^n = h - 2n^s abck" - bổ đề 6 read at the
        instance produced by S0/S2. h is carried as the printed pair of cases
        ("t ∤ n" -> h = c^n, "n | t" -> h = n^{ns-1} c^n), which is how
        L6.L6_bo_de_6 already returns it; the print does not branch on it here.
    S4  "(3) => (a^n + n^s abck)^n + (b^n + n^s abck)^n = (h - n^s abck)^n"
        followed by the expansion of that identity into the alternating sum
        = 0 printed at the end of the region. This is the substitution of S3
        into (3), nothing more.

  ENCODING NOTE (why the file's first declaration is the leaf's S3, not S0).
  Only S3 is written so far. It takes S0's output (the coprimalities and (3)) as
  hypotheses, which is exactly what S3 needs from the print; S0's own content is
  L1.L1_bo_de_1 applied to the lane's opening hypothesis, and S1's is a
  four-way `Odd.neg_pow` rewrite. Strict source order therefore still requires
  S0 and S1 to be written before this leaf can be DONE, and the ledger records
  the round that verified S3 under its post-rename name.
