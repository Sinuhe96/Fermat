  S0 [P006-R3 l1] The double sum over i of (h - X)^(n-1-i)(b^n + X)^i equals the
     triple sum of the expansion (claim 1 above).              [Lean: M1F4_step_S0_triple]
  S1 [P006-R3 l1, right-hand side] That triple sum equals the binomial form
     Σ_i C(n,i) a^(n(n-1-i)) X^i (claim 2). From the printed a^n Σ = (a^n+X)^n by
     cancelling a^n — which needs a ≠ 0, an F3 side condition carried as an
     explicit hypothesis (see the docstring of M1F4_step_S1_binomial).
                                              [Lean: M1F4_step_S1_binomial]
  S2 [P006-R3 l2-l5 + P007-R1 l1-l2] The l+j >= 5 split.
     CONTENTS FROZEN AND VERIFIED against the signed LaTeX (2026-09-28): the
     printed boundary display is exactly one sum for EACH pair (j,l) with
     j + l <= 4 - there are FIFTEEN, not ten (C(6,2) = 15) - and for each pair
     the printed range is exactly i in [l, n-1-j], with the summand
     (-1)^j C(n-1-i,j) C(i,l) h^(n-1-i-j) b^(n(i-l)) X^(l+j), the same term as in
     the triple sum. Checked pair by pair against the region record:
       (0,4) i=4..n-1   (4,0) i=0..n-5   (3,1) i=1..n-4   (1,3) i=3..n-2
       (2,2) i=2..n-3   (2,1) i=1..n-3   (1,2) i=2..n-2   (3,0) i=0..n-4
       (0,3) i=3..n-1   (0,2) i=2..n-1   (2,0) i=0..n-3   (1,1) i=1..n-2
       (0,1) i=1..n-1   (1,0) i=0..n-2   (0,0) i=0..n-1
     ALL FIFTEEN are the natural [l, n-1-j], so the display carries NO misprint -
     a positive verification result that also confirms the sympy screen's
     "partition exact" at representation level.
     LEAN FORM (designed, not yet written): the fifteen sums are one filtered
     expression, `sum_{j<5} sum_{l<5-j} sum_{i in Ico l (n-j)} f i j l`, and the
     step states
       sum_i sum_j sum_l f  =  sum_i sum_j sum_l (if 5 <= j+l then f i j l else 0)
                               + sum_{j<5} sum_{l<5-j} sum_{i in Ico l (n-j)} f i j l
     with `5 <= n` (every range non-empty; the paper has n > 11). Proof content:
     the pointwise filter complement at fixed (i,j,l), then the reindexing that
     moves the j+l <= 4 part into natural-range order - a `Finset.sum_comm` /
     `Ico` computation with no algebra. Expect this to be the leaf's most
     expensive step; it is the one item of this leaf that is NOT started.
     FIRST HALF LANDED (round 36, EXIT 0, 22 s, 0 warnings): the pointwise
     filter complement, as the generic support lemma `M1F4_sum_complement`
     (`Σ f = Σ (if 5 ≤ j+l then f else 0) + Σ (if ¬(5 ≤ j+l) then f else 0)`,
     lifted through the three nested ranges, stated for an arbitrary summand so
     it is about the index structure only).
     SECOND HALF - THE REINDEXING (designed; the only remaining work of S2).
     Statement, for `5 ≤ n`:
       sum_{i<n} sum_{j<n-i} sum_{l≤i} (if j+l ≤ 4 then f i j l else 0)
         = sum_{j<5} sum_{l<5-j} sum_{i ∈ Ico l (n-j)} f i j l
     THE TWO INDEX SETS ARE THE SAME SET in a different order: the conditions
     `i < n`, `j < n-i`, `l ≤ i`, `j+l ≤ 4` are equivalent to
     `j ≤ 4`, `l ≤ 4-j`, `l ≤ i`, `i ≤ n-1-j`
     (j+l ≤ 4 iff l ≤ 4-j; j < n-i iff i ≤ n-1-j; and i ≤ n-1-j gives i < n since
     j ≥ 0; conversely i < n with j+l ≤ 4 and n ≥ 5 gives j ≤ 4 ≤ n-1, hence
     i ≤ n-1-j). The summand is identical on both sides, so this is a pure
     index-set reindexing: no algebra, and no side condition beyond `5 ≤ n`.
     Proof obligations, in order:
       (1) `¬(5 ≤ j+l) ↔ j+l ≤ 4` (`Nat.not_le` / `Nat.lt_succ_iff`);
       (2) the bijection above, as an index-set equality plus `Finset.sum_congr`;
       (3) the range forms `range (i+1) = Ico 0 (i+1)` so the three nested sums
           flatten to one sum over triples (`Finset.sum_sigma`).
     RECOMMENDED ROUTE for the next session: flatten BOTH sides to
     `sum_{p ∈ S} f p.1 p.2 p.3` with `S` a Finset of triples (LHS via
     `Finset.sigma` over the three nested ranges, RHS the analogous construction
     over `j<5`, `l<5-j`, `Ico l (n-j)`), prove `S = T` by `Finset.ext` + `omega`,
     then `Finset.sum_congr`. That route avoids dependent-range sum surgery.
     Cost estimate: 40-80 lines, several rounds - the leaf's most expensive step.
     LANDED (rounds 39-41, EXIT 0, 0 warnings, permitted axioms only, no sorryAx):
     `M1F4_reindex` (the re-indexing, 2 rounds: one F2 `rw` direction) and the
     composed author step `M1F4_step_S2_split` (= `M1F4_sum_complement` +
     `M1F4_reindex`, plus the pointwise `¬(5 ≤ j+l) ↔ j+l ≤ 4` bridge).
                                     [Lean: M1F4_reindex, M1F4_step_S2_split]
  S3 [P007-R1 l4-l6] The right-hand side exactly as the author prints it after the
     split: `Σ_{i=5}^{n} C_n^i a^{(n-1)(n-i)} (n^s bck)^i` (the tail, with the
     `a^i` ABSORBED — `n(n-1-i) = (n-1)(n-i) - i`, so
     `a^{n(n-1-i)}(n^s abck)^i = a^{(n-1)(n-i)}(n^s bck)^i`) plus the four
     explicit terms `a^{n(n-1)} + n a^{n(n-2)} n^s abck +
     [n(n-1)/2] a^{n(n-3)} (n^s abck)^2 + [n(n-1)(n-2)/6] a^{n(n-4)} (n^s abck)^3
     + [n(n-1)(n-2)(n-3)/24] a^{n(n-5)} (n^s abck)^4`. This is where
     `M1F4_absorb` is used.
     ENCODING CONSTRAINT (the leaf's F1, round 31): the tail `Σ_{i=5}^{n}` INCLUDES
     `i = n`, where `a^{n(n-1-i)}` is ℕ-unsafe (`n-1-n` truncates to `0`, giving
     `a^0` instead of `a^{-n}`). State every range that contains `i = n` in the
     ABSORBED form `a^{(n-1)(n-i)}(n^s bck)^i`, which is ℕ-safe and is exactly the
     author's own printed form on this line. The equality of the two forms holds
     only over ℤ exponents.                     [TODO]
  S4 [P007-R1 l8-l12] The first five boundary sums (the pairs (j,l) with j+l = 4,
     i.e. the five X^4 sums) converted from binomial to the printed FACTORIAL
     form, in the author's order:
       1/24 Σ_{i=4}^{n-1} i(i-1)(i-2)(i-3) h^{n-1-i} b^{n(i-4)} (n^s abck)^4
       1/24 Σ_{i=0}^{n-5} (n-1-i)(n-2-i)(n-3-i)(n-4-i) h^{n-5-i} b^{ni} (n^s abck)^4
     - 1/6  Σ_{i=1}^{n-4} i(n-1-i)(n-2-i)(n-3-i) h^{n-4-i} b^{n(i-1)} (n^s abck)^4
     - 1/6  Σ_{i=3}^{n-2} (n-1-i)i(i-1)(i-2) h^{n-2-i} b^{n(i-3)} (n^s abck)^4
       1/4  Σ_{i=2}^{n-3} (n-1-i)(n-2-i)i(i-1) h^{n-3-i} b^{n(i-2)} (n^s abck)^4
     Content: `C_i^4 = i(i-1)(i-2)(i-3)/24` and
     `C_{n-1-i}^4 = (n-1-i)(n-2-i)(n-3-i)(n-4-i)/24` (and the `C_i^k`/`C_{n-1-i}^k`
     for k = 1,2,3 in the mixed pairs) - pure `Nat.choose`-to-falling-factorial
     identities, no side condition on `n`. `[TODO]`
  S5+ THE REMAINING TEN conversions are NOT in this chunk: the display is one
     continuous re-statement of the identity whose middle (the X^3 and X^2 sums)
