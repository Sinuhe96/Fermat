source_text: |
  [PDF p6 R3 (all five printed lines) and p7 R1 (its first four lines),
  byte-copied from the signed region records pipeline/01-extract/regions/p006.yml
  and p007.yml (both REVIEWED). Step-boundary note (transcription fact, not an
  author error): M1_LANE.md 5 pencilled P006-R3 l1 into M1-FRAG-03, but
  M1-FRAG-02's boundary revision had already moved (8),(9),(10) out, so R3 l1 --
  the triple-sum expansion that the whole regrouping starts from -- is stated
  here instead, as this leaf's first step.]
  \[ \Leftrightarrow \sum_{i=0}^{n-1} \sum_{j=0}^{n-1-i} \sum_{l=0}^{i} (-1)^j C_{n-1-i}^{j} C_{i}^{l} h^{n-1-i-j} b^{n(i-l)} (n^s abck)^{l+j} = \sum_{i=0}^{n} C_{n}^{i} a^{n(n-1-i)} (n^s abck)^{i} \]
  \[ \Leftrightarrow \sum_{i=0}^{n-1} \sum_{\substack{j=0 \\ (l+j \geq 5)}}^{n-1-i} \sum_{l=0}^{i} (-1)^j C_{n-1-i}^{j} C_{i}^{l} h^{n-1-i-j} b^{n(i-l)} (n^s abck)^{l+j} + \sum_{i=4}^{n-1} (-1)^0 C_{n-1-i}^{0} C_{i}^{4} h^{n-1-i} b^{n(i-4)} (n^s abck)^{4} + \sum_{i=0}^{n-5} (-1)^4 C_{n-1-i}^{4} C_{i}^{0} h^{n-5-i} b^{ni} (n^s abck)^{4} + \]
  \[ + \sum_{i=1}^{n-4} (-1)^3 C_{n-1-i}^{3} C_{i}^{1} h^{n-4-i} b^{n(i-1)} (n^s abck)^{4} + \sum_{i=3}^{n-2} (-1)^1 C_{n-1-i}^{1} C_{i}^{3} h^{n-2-i} b^{n(i-3)} (n^s abck)^{4} + \sum_{i=2}^{n-3} (-1)^2 C_{n-1-i}^{2} C_{i}^{2} h^{n-3-i} b^{n(i-2)} (n^s abck)^{4} + \]
  \[ + \sum_{i=1}^{n-3} (-1)^2 C_{n-1-i}^{2} C_{i}^{1} h^{n-3-i} b^{n(i-1)} (n^s abck)^{3} + \sum_{i=2}^{n-2} (-1)^1 C_{n-1-i}^{1} C_{i}^{2} h^{n-2-i} b^{n(i-2)} (n^s abck)^{3} + \]
  \[ + \sum_{i=0}^{n-4} (-1)^3 C_{n-1-i}^{3} C_{i}^{0} h^{n-4-i} b^{ni} (n^s abck)^{2} + \sum_{i=3}^{n-1} (-1)^0 C_{n-1-i}^{0} C_{i}^{3} h^{n-1-i} b^{n(i-3)} (n^s abck)^{3} + \sum_{i=2}^{n-1} (-1)^0 C_{n-1-i}^{0} C_{i}^{2} b^{n(i-2)} h^{n-1-i} (n^s abck)^{2} + \]
  
  \[ + \sum_{i=0}^{n-3}(-1)^2 C_{n-1-i}^{2} C_i^{0} b^{ni} h^{n-3-i} (n^s abck)^2 + \sum_{i=1}^{n-2}(-1)^1 C_{n-1-i}^{1} C_i^{1} b^{n(i-1)} h^{n-2-i} (n^s abck)^2 + \sum_{i=1}^{n-1}(-1)^0 C_{n-1-i}^{0} C_i^{1} b^{n(i-1)} h^{n-1-i} n^s abck + \]
  \[ + \sum_{i=0}^{n-2}(-1)^1 C_{n-1-i}^{1} C_i^{0} b^{ni} h^{n-2-i} n^s abck + \sum_{i=0}^{n-1}(-1)^0 C_{n-1-i}^{0} C_i^{0} h^{n-1-i} b^{ni} \]
  \[ = \sum_{i=5}^{n} C_n^{i} a^{(n-1)(n-i)} (n^s bck)^i + a^{n(n-1)} + n a^{n(n-2)} n^s abck + \frac{n(n-1)}{2} a^{n(n-3)} (n^s abck)^2 + \frac{n(n-1)(n-2)}{6} a^{n(n-4)} (n^s abck)^3 + \]
  \[ + \frac{n(n-1)(n-2)(n-3)}{24} a^{n(n-5)} (n^s abck)^4 \]
formal_hint: |
  The leaf is the regrouping that follows the printed (8)-(10). Its two printed
  lines per stage are the SAME quantity written two ways, which is what the steps
  establish:

  1. the double sum of the substituted difference equation
       Σ_{i=0}^{n-1} (h - X)^(n-1-i) (b^n + X)^i
     equals the triple sum got by expanding both binomials
       Σ_i Σ_j Σ_l (-1)^j C(n-1-i,j) C(i,l) h^(n-1-i-j) b^(n(i-l)) X^(l+j)
     (ranges: i in [0, n-1], j in [0, n-1-i], l in [0, i]);
  2. that triple sum equals Σ_{{i=0}}^n C(n,i) a^((n-1)(n-i)) (n^s bck)^i -- the
     binomial expansion of (a^(n-1) + n^s bck)^n, which is what p. 6 R2's last
     line prints. ENCODE THIS FORM, not R3's alternate a^(n(n-1-i)) (n^s abck)^i:
     the two are equal as Z-exponent expressions (measured: difference 0 at
     n = 5 and n = 7) but the R3 form is FALSE in Nat-encoded exponents at
     i = n, where n - 1 - i truncates to 0 and a factor a^n is lost. Lean caught
     this in one round; see M1_LANE.md 7 and the docstring of M1F4_absorb;
  3. the l+j >= 5 split: the part of the triple sum with l+j >= 5 equals the
     whole triple sum minus the terms with l+j <= 4, and those terms are the
     FIFTEEN printed boundary sums (one for each pair (j,l) with j + l <= 4,
     C(6,2) = 15; an earlier note in this file said ten - corrected 2026-09-28
     after freezing the display verbatim), whose binomial coefficients the author
     writes out in factorial form (e.g. (1/24)i(i-1)(i-2)(i-3)).

  TWO PRINTED FORMS OF THE SAME RIGHT-HAND SIDE - equal only as Z-exponent
  expressions, and that distinction is load-bearing:
      R2 prints  Σ_{{i=0}}^n C(n,i) a^((n-1)(n-i)) (n^s bck)^i    <- ENCODE THIS
      R3 prints  Σ_{{i=0}}^n C(n,i) a^(n(n-1-i)) (n^s abck)^i
  They agree because n(n-1-i) = (n-1)(n-i) - i, so R3's summand is
  a^((n-1)(n-i)) a^(-i) (n^s abck)^i = a^((n-1)(n-i)) (n^s bck)^i, and at i = n
  the exponent -n cancels the bracket's a^n. Measured: the two sums differ by 0
  at n = 5 and n = 7. But with Nat-encoded exponents, n - 1 - i at i = n
  truncates to 0 and the R3 form is off by a factor a^n; the split identity is
  then false at i = n, which is exactly why M1F4_absorb carries i + 1 <= n and
  why S1 is stated in the R2 form. Related: the p. 16 "exponent turnover" flag is
  this same convention, not a misprint (M1_LANE.md 7).
