author_steps: |
  Normalized ordered step map (8 steps; the plan's count). Steps marked TODO are
  not yet written; this leaf is IN PROGRESS and enters the ledger only when all
  of them are S1.

  S0 [P006-R3 l1] The double sum over i of (h - X)^(n-1-i)(b^n + X)^i equals the
     triple sum of the expansion (claim 1 above).              [Lean: M1F4_step_S0_triple]
  S1 [P006-R3 l1, right-hand side] That triple sum equals the binomial form
     Σ_i C(n,i) a^(n(n-1-i)) X^i (claim 2). From the printed a^n Σ = (a^n+X)^n by
     cancelling a^n — which needs a ≠ 0, an F3 side condition carried as an
     explicit hypothesis (see the docstring of M1F4_step_S1_binomial).
                                              [Lean: M1F4_step_S1_binomial]
  S2 [P006-R3 l2-l5 + P007-R1 l1-l2] The l+j >= 5 split.
     CONTENTS FROZEN AND VERIFIED against the signed LaTeX (2026-09-28): the
     printed boundary display is exactly one sum for EACH pair (j,l) with
     j + l <= 4 - there are FIFTEEN, not ten (C(6,2) = 15) - and for each pair
     the printed range is exactly i in [l, n-1-j], with the summand
     (-1)^j C(n-1-i,j) C(i,l) h^(n-1-i-j) b^(n(i-l)) X^(l+j), the same term as in
     the triple sum. Checked pair by pair against the region record:
       (0,4) i=4..n-1   (4,0) i=0..n-5   (3,1) i=1..n-4   (1,3) i=3..n-2
       (2,2) i=2..n-3   (2,1) i=1..n-3   (1,2) i=2..n-2   (3,0) i=0..n-4
       (0,3) i=3..n-1   (0,2) i=2..n-1   (2,0) i=0..n-3   (1,1) i=1..n-2
       (0,1) i=1..n-1   (1,0) i=0..n-2   (0,0) i=0..n-1
     ALL FIFTEEN are the natural [l, n-1-j], so the display carries NO misprint -
     a positive verification result that also confirms the sympy screen's
     "partition exact" at representation level.
     LEAN FORM (designed, not yet written): the fifteen sums are one filtered
     expression, `sum_{j<5} sum_{l<5-j} sum_{i in Ico l (n-j)} f i j l`, and the
     step states
       sum_i sum_j sum_l f  =  sum_i sum_j sum_l (if 5 <= j+l then f i j l else 0)
                               + sum_{j<5} sum_{l<5-j} sum_{i in Ico l (n-j)} f i j l
     with `5 <= n` (every range non-empty; the paper has n > 11). Proof content:
     the pointwise filter complement at fixed (i,j,l), then the reindexing that
     moves the j+l <= 4 part into natural-range order - a `Finset.sum_comm` /
     `Ico` computation with no algebra. Expect this to be the leaf's most
     expensive step; it is the one item of this leaf that is NOT started.
                                                               [TODO]
  S3-S7 [P006-R3 l2-l5, P007-R1 l1-l4] The FIFTEEN boundary sums (one per pair
     (j,l) with j + l <= 4; see S2) in the printed factorial forms, in the
     author's order, plus the rewrite of the `i >= 5`
     part as `Σ_{i=5}^{n} C(n,i) a^{(n-1)(n-i)} (n^s bck)^i` — which is where
     `M1F4_absorb` (above) is used, moving the `a^i` between the explicit factor
     and the exponent of `a`. Then S7 identifies the result with the expansion of
     `(a^(n-1) + n^s bck)^n` truncated at `i >= 5` plus the four printed terms.
