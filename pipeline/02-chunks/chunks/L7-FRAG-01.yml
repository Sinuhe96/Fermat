source_text: |
  [PDF p1 bottom → p2 top: Lemma 7 statement]

  Bổ đề 7:
  Nếu n là số nguyên tố lớn hơn 3 và ba số nguyên a, b, c, thỏa mãn
    abc ≢ 0 (mod n),
    a^n + b^n − c^n ≡ 0 (mod n²),
    a^{n(n−2)} + b^{n(n−2)} − c^{n(n−2)} ≡ 0 (mod n)
  thì ta có
    (a^n − b^n)(c^n + a^n)(c^n + b^n) ≢ 0 (mod n).

  [Remaining conclusions (separate chunks):]
  a^{n²} + b^{n²} − c^{n²} ≡ 0 (mod n²),
  a^{n(n−3)} + b^{n(n−3)} + c^{n(n−3)} ≡ c^{3n} + b^{3n} ≡ a^{3n} − b^{3n}
    ≡ b^nc^n + a^{2n} ≡ c^na^n + b^{2n} ≡ b^na^n − c^{2n} ≡ 0 (mod n²),
  n ≡ 1 (mod 6),
  a^{n(n−2)} + b^{n(n−2)} − c^{n(n−2)} ≡ a^{n(n−4)} + c^{n(n−4)}
    ≡ b^{n(n−4)} + c^{n(n−4)} ≡ a^{n(n−4)} − b^{n(n−4)} ≡ 0 (mod n²).

  [PDF p4 bottom → p5: author's proof of the non-divisibility conclusion]

  1. Vì abc ≢ 0 (mod n), nên a ≢ 0, b ≢ 0, c ≢ 0 (mod n).
     Theo bổ đề 5d (Euler, φ(n²)=n(n−1)):
       c^{n(n−1)} ≡ a^{n(n−1)} ≡ b^{n(n−1)} ≡ 1 (mod n²).

  2. Suy ra a^{n²}+b^{n²}−c^{n²}
       = (a^n+b^n−c^n) − c^n[c^{n(n−1)}−1] + a^n[a^{n(n−1)}−1] + b^n[b^{n(n−1)}−1]
       ≡ 0 (mod n²).                                              … (a)

  3. Từ GT2: c^n ≡ a^n + b^n (mod n²).                           … (b)
     Từ GT3: c^{n(n−2)} ≡ a^{n(n−2)} + b^{n(n−2)} (mod n).      … (c)

  4. Nhân (c) cho a^nb^nc^n ≢ 0 (mod n), dùng Euler (bổ đề 5d):
     c^{n(n−1)}a^nb^n ≡ a^{n(n−1)}c^nb^n + b^{n(n−1)}c^na^n (mod n)
     ⟹ a^nb^n ≡ c^n(a^n+b^n) ≡ c^{2n} (mod n).                  … (d)

  5. Từ (d): a^nb^n ≡ (a^n+b^n)² (mod n)
     ⟹ b^{2n}+a^nb^n+a^{2n} ≡ 0 (mod n).

  6. ⟹ b^{2n}+a^nc^n ≡ 0 (mod n)   [dùng (b)]
     ⟹ b^{3n}+c^n(a^nb^n) ≡ 0 (mod n)
     ⟹ b^{3n}+c^{3n} ≡ 0 (mod n)   [dùng (d)].

  7. Bổ đề 5c: (b^{3n})^n+(c^{3n})^n ≡ 0 (mod n²).
     Bổ đề 5d: b^{3n}+c^{3n} ≡ 0 (mod n²).

  8. Lưu ý: (c) và (b) có cấu trúc đối xứng trong vành Z.
     Nếu b^n+c^n ≡ 0 (mod n), thì:
       c^n ≡ −b^n (mod n), a^n ≡ −2b^n (mod n),
       a^{n(n−2)}+2b^{n(n−2)} ≡ 0 (mod n),
       (−2)^{n−2}b^{n(n−2)}+2b^{n(n−2)} ≡ 0 (mod n),
       −2^{n−2}+2 ≡ 0 (mod n)  [vì n lẻ, b≢ 0].

  9. −(2^{n−1}−1)+3 ≡ 0 (mod n).
     Định lý nhỏ Fermat: 2^{n−1} ≡ 1 (mod n).
     ⟹ 3 ≡ 0 (mod n) ⟹ n=3, vô lý.

  10. Vậy b^n+c^n ≢ 0 (mod n). Tương tự: a^n+b^n ≢ 0, c^n+a^n ≢ 0 (mod n).

  11. Tóm lại: (a^n−b^n)(c^n+a^n)(c^n+b^n) ≢ 0 (mod n). (đpcm)
formal_hint: |
  Hypotheses:
    n prime > 3,
    integers a b c with n ∤ a*b*c,
    a^n + b^n ≡ c^n [ZMOD n²],
    a^{n(n−2)} + b^{n(n−2)} ≡ c^{n(n−2)} [ZMOD n]
  Conclusion:
    ¬ (n:ℤ) ∣ (a^n − b^n) * (c^n + a^n) * (c^n + b^n)
