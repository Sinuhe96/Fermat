  S0 [p2 ¶1] Assume n > 2 with nonzero integer solution
    (u₀,v₀,t₀) of (1); set d = (u₀,v₀,t₀).
  S1 [p2 ¶1] Divide out: u₀ = ud, v₀ = vd, t₀ = td with
    u,v,t ∈ ℤ* and (u,v,t) = 1; from u₀^n+v₀^n = t₀^n get
    u^n + v^n = t^n (1''); so (u,v,t) is a nonzero solution.
  S2 [p2 ¶2] Assume (u,v) = d'.
  S3 [p2 ¶2] From (1''): d'^n ∣ t^n ("t^n ⋮ d'^n": t^n left,
    d'^n right of the mark).
  S4 [p2 ¶2] d'^n ∣ t^n ⟹ d' ∣ t ("t ⋮ d'").
  S5 [p2 ¶2] (u,v,t) = 1 with d' ∣ u,v,t ⟹ d' = 1;
    hence (u,v) = 1.
  S6 [p2 ¶3] "Chứng minh tương tự": (u,t) = (t,v) = 1. ∎
