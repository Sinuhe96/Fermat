id: L1-01
title: "Lemma 1 — reduction to pairwise-coprime solution (full lemma)"
pdf_pages: [1, 2]
kind: lemma-statement
depends_on: []
source_text: |
  [PDF p1: Lemma 1 statement]

  Bổ đề 1:
  Cho n ∈ ℕ, n ≥ 3. Nếu phương trình (PT) x^n + y^n = z^n (1)
  có nghiệm nguyên khác không thì bao giờ cũng tồn tại nghiệm
  nguyên x = u, y = v, z = t sao cho
  (u, v) = (u, t) = (v, t) = 1.

  [PDF p2 §1: author's proof ("1. Chứng minh bổ đề 1")]

  Giả sử tồn tại số nguyên n lớn hơn 2, sao cho PT(1) có
  x = u₀, y = v₀, z = t₀ là một nghiệm nguyên khác không và
  (u₀, v₀, t₀) = d. Khi đó tồn tại ba số u, v, t ∈ ℤ* sao cho
  (u, v, t) = 1, u₀ = ud, v₀ = vd, t₀ = td và u₀^n + v₀^n = t₀^n,
  suy ra u^n + v^n = t^n (1''), suy ra x = u, y = v, z = t là một
  nghiệm nguyên khác không của PT(1).
  Giả sử (u, v) = d', từ (1'') suy ra t^n ⋮ d'^n, suy ra t ⋮ d',
  mà (u, v, t) = 1 nên d' = 1. Vậy (u, v) = 1.
  Chứng minh tương tự ta cũng có (u, t) = (t, v) = 1.
  Bổ đề 1 đã được chứng minh.
formal_hint: |
  Hypotheses:
    n : ℕ, n ≥ 3,
    PT(1) x^n + y^n = z^n has a nonzero integer solution
  Conclusion:
    exists nonzero integers u v t with u^n + v^n = t^n and
    pairwise (u,v) = (u,t) = (v,t) = 1  (Int.gcd = 1)
