id: L7-FRAG-03
title: "Bổ đề 7 — b^{3n}+c^{3n} ≡ 0 (mod n²) and its symmetric instances (19), (20)"
pdf_pages: [2, 4, 5]
kind: lemma-proof-step
depends_on: [L5-01, L7-FRAG-02]
source_text: |
  [PDF p5 §7, immediately after (d)]

  \Rightarrow a^n b^n \equiv (a^n + b^n)^2 \pmod n
  \Rightarrow b^{2n} + a^n b^n + a^{2n} \equiv 0 \pmod n
  \Rightarrow b^{2n} + a^n (a^n + b^n) \equiv 0 \pmod n
  \Rightarrow b^{2n} + a^n c^n \equiv 0 \pmod n \text{ (vì } a^n + b^n \equiv c^n \pmod{n^2}\text{)}
  \Rightarrow b^{3n} + c^n (a^n b^n) \equiv 0 \pmod n
  \Rightarrow b^{3n} + c^{3n} \equiv 0 \pmod n \text{ (vì } a^n b^n \equiv c^{2n} \pmod n\text{)}
  \Rightarrow (b^{3n})^n + (c^{3n})^n \equiv 0 \pmod{n^2} \text{ (áp dụng bổ đề 5c)}
  \Rightarrow (b^3)^{n(n-1)} . b^{3n} + (c^3)^{n(n-1)} . c^{3n} \equiv 0 \pmod{n^2}
  \Rightarrow b^{3n} + c^{3n} \equiv 0 \pmod{n^2} \text{ (áp dụng bổ đề 5d): }
    (b^3)^{n(n-1)} \equiv (c^3)^{n(n-1)} \equiv 1 \pmod{n^2}\text{)}

  [PDF p5 §7, the "Lưu ý" symmetry paragraph]
  Lưu ý rằng trong hai giả thiết đồng dư (c) và (b) của Bổ đề 7 có mỗi cặp
  (a;b), (c;-a), (c;-b) đối xứng nhau, nó bình đẳng và có cùng cấu trúc số học
  trong vành ℤ. Cho nên, nếu có b^{3n} + c^{3n} \equiv 0 \pmod{n^2} thì ta cũng có
  a^{3n} + c^{3n} \equiv a^{3n} + (-b)^{3n} \equiv 0 \pmod{n^2}
  \text{ hay } a^{3n} + c^{3n} \equiv a^{3n} - b^{3n} \equiv 0 \pmod{n^2}.

  [PDF p30 R2: the two numbered forms the main proof cites]
  c^{3n} \equiv -b^{3n} (\mathrm{mod}\ n^2)\ (19), a^{3n} \equiv b^{3n} (\mathrm{mod}\ n^2)\ (20)
formal_hint: |
  From (d) `a^n * b^n ≡ c^{2n} [ZMOD n]` and (b) `c^n ≡ a^n + b^n [ZMOD n]`, the
  printed chain derives `b^{3n} + c^{3n} ≡ 0 [ZMOD n]` (S5, S6), lifts it to
  modulus n² by bổ đề 5c at `(b^{3n}, c^{3n})` and bổ đề 5d at `b^3`, `c^3`
  (S7, S8, S9), and then re-instantiates the same chain with `(a; b)` swapped
  (the print's own "Lưu ý" symmetry) to obtain
  `a^{3n} + c^{3n} ≡ 0 [ZMOD n^2]` (S10) and `a^{3n} - b^{3n} ≡ 0 [ZMOD n^2]`
  (S11) — the main proof's (19) and (20).
  S5–S9 are stated for an abstract pair `(X, Y)` (with `X = a, Y = b` in the
  printed instance): the print itself asserts the swap is the same argument,
  which is what makes the abstraction faithful rather than a new route.
