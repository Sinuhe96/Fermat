source_text: |
  [PDF p2 top: bổ đề 7's conclusion list]
  a^{n(n-3)} + b^{n(n-3)} + c^{n(n-3)} \equiv 0(\mathrm{mod}\ n^2)
  a^{n(n-2)} + b^{n(n-2)} - c^{n(n-2)} \equiv a^{n(n-4)} + c^{n(n-4)}
    \equiv b^{n(n-4)} + c^{n(n-4)} \equiv a^{n(n-4)} - b^{n(n-4)} \equiv 0 (\mathrm{mod}\ n^2).

  [PDF p5 §7, the closing bullet]
  * Vì n \equiv 1 \pmod 6, nên n = 6l + 1, l \in \mathbb{N}^*. Do đó
  a^{n(n-4)} + c^{n(n-4)} = a^{3n(2p-1)} + (c^{3n})^{(2p-1)}
    \equiv a^{3n(2p-1)} - a^{3n(2p-1)} = 0 \pmod n
    \text{ (vì } c^{3n} \equiv -a^{3n} \pmod{n^2}\text{), suy ra}
  a^{n(n-4)} + c^{n(n-4)} \equiv 0 \pmod{n^2}.
  Chứng minh tương tự ta cũng có: b^{n(n-4)} + c^{n(n-4)} \equiv 0 \pmod{n^2}
  suy ra a^{n(n-4)} - b^{n(n-4)} \equiv 0 \pmod n \text{ (đpcm).}

  [PDF p30 R2: the numbered forms the main proof cites]
  a^{n(n-4)} + c^{n(n-4)} \equiv b^{n(n-4)} + c^{n(n-4)} \equiv a^{n(n-4)} - b^{n(n-4)} \equiv 0 (\mathrm{mod}\ n^2)\ (21)
  a^{n(n-3)} + b^{n(n-3)} + c^{n(n-3)} \equiv 0 (\mathrm{mod}\ n^2)\ (22)
formal_hint: |
  S18: `n % 6 = 1` gives `n = 6l+1`, hence `n − 4 = 3(2l−1)` with `2l−1` odd;
  from (21)'s input `c^{3n} ≡ −a^{3n} (mod n²)` (i.e. (19)), the sum
  `a^{n(n−4)}+c^{n(n−4)} = (a^{3n})^{2l−1} + (c^{3n})^{2l−1}` collapses to
  `x − x = 0`. The printed line shows the congruence mod n and then concludes
  mod n²; the encoded statement is the mod-n² one (the display's (21) form),
  which is what the algebra actually gives.
  S19: the same with `(a; c)` replaced by `(b; c)`.
  S20: `a^{n(n−4)} ≡ −c^{n(n−4)} ≡ b^{n(n−4)} (mod n²)` ⇒
  `a^{n(n−4)} − b^{n(n−4)} ≡ 0 (mod n²)`.
  S21: (22) `a^{n(n−3)}+b^{n(n−3)}+c^{n(n−3)} ≡ 0 (mod n²)` — stated on p2 and
  used by the main proof at p30 R2 ("Từ (17), (21), (22), ta có"), but NOT
  derived on p5: an F3 fill-in, derived here from the author's own material —
  `a^{n(n−3)} = a^n·a^{n(n−4)}` together with (21)'s
  `a^{n(n−4)} ≡ b^{n(n−4)} ≡ −c^{n(n−4)}` and (b) `c^n ≡ a^n+b^n (mod n²)`.
