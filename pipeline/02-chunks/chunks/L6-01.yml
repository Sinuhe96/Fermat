  summary); extract_pymupdf.txt lines 2056–3440), which reproduce the same
  proof but drop the math glyphs (MANUAL pages 3, 4). Vision probe this
  session: the harness CAN route a PNG to a vision model here (page crops,
  `?q=`), but its output is demonstrably noisy on this document — it read the
  summary exponent as "s−1" (dropping a character), rendered ⋮ as ":",
  rendered "⋮ n²" as ": n²", and (when the question named the candidate
  orders) claimed the 6.2 exponents are all "sn-1", contradicting both text
  layers. It was therefore NOT treated as authoritative; the signed region
  LaTeX remains the render read of record, and the disagreement is reported
  in the F1 notes instead of being resolved silently.

  S0 [p1 statement, P001·R3] Hypotheses: n odd prime; (1) has a nonzero
    solution x=u,y=v,z=t with (u,v)=(u,t)=(v,t)=1 and uv ⋮̸ n. Conclusion:
    ∃ nonzero pairwise-coprime a,b,c,k with a,b,c,k ⋮̸ n, ∃ s > 1:
    v = a^n+n^s abck, u = b^n+n^s abck, t = h − n^s abck,
    a^n+b^n = h − 2n^s abck, h = c^n (t ⋮̸ n) or h = n^{ns−1}c^n (t ⋮ n).
  S1 [p3 §6, P003·R2] "Vì x=u, y=v, z=t là nghiệm của PT (1) nên ta có
    u^n + v^n = t^n (3)" — pure instantiation of the S0 hypothesis (3).
  S2 [p3 §6, P003·R2] "suy ra: (u+v) Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i = t^n
    (4), (t−v) Σ t^{n−1−i} v^i = u^n (5), (t−u) Σ t^{n−1−i} u^i = v^n (6)" —
    the three factorisations: (4) from t^n = u^n+v^n (odd-n sum
    factorisation), (5) from t^n − v^n = u^n, (6) from t^n − u^n = v^n.
  S3 [p3 §6, P003·R2 end] "Xét hai trường hợp của t." + "6.1. Khi t không chia
    hết cho n" ⇒ case 6.1; "Ta có (u,v) = (u,t) = (v,t) = 1 và cùng với (4),
    (5), (6) suy ra (u+v) ⋮̸ n, (t−v) ⋮̸ n và (t−u) ⋮̸ n" — under t ⋮̸ n the
    three factors cannot be divisible by n (n | (u+v) would give n | t^n via
    (4); n | (t−v) gives n | u via (5); n | (t−u) gives n | v via (6), and
    uv ⋮̸ n with n prime forbids both).
  S4 [p3 §6.1, P003·R3] "áp dụng bổ đề 5 ta có (u+v, Σ(−1)^i u^{n−1−i}v^i) =
    (t−v, Σ t^{n−1−i}v^i) = (t−u, Σ t^{n−1−i}u^i) = 1, (Σ(−1)^i u^{n−1−i}v^i)
    ⋮̸ n, (Σ t^{n−1−i}v^i) ⋮̸ n, (Σ t^{n−1−i}u^i) ⋮̸ n" — bổ đề 5a) applied to
    the three pairs (u,v), (t,v), (t,u) (each needs the pair coprime, which
    (u,v)=(v,t)=(u,t)=1 supplies, and the sum-factor ⋮̸ n from S3).
  S5 [p3 §6.1, P003·R3] "kết hợp với (4), (5), (6) và áp dụng bổ đề 3, ta
    có: u+v = c^n (4') và Σ(−1)^i u^{n−1−i}v^i = c'^n, với t = c.c', c,c' ∈ ℤ*,
    (c,c') = 1 và c ⋮̸ n, c' ⋮̸ n; t−v = b^n (5') và Σ t^{n−1−i}v^i = b'^n, với
    u = b.b', b,b' ∈ ℤ*, (b,b') = 1 và b ⋮̸ n, b' ⋮̸ n; t−u = a^n (6') và
    Σ t^{n−1−i}u^i = a'^n, với v = a.a', a,a' ∈ ℤ*, (a,a') = 1, và a ⋮̸ n,
    a' ⋮̸ n" — bổ đề 3 applied to (4), (5), (6) with the gcd-1 results of S4
    (three instances; (c,c') ⟺ (c₁,c₂) of bổ đề 3).
  S6 [p3 §6.1, P003·R3] "(a,b) = (a,c) = (c,b) = 1 (vì (b.b', a.a') =
    (b.b', c.c') = (a.a', c.c') = 1)" — the printed clause is duplicated with
    an unmatched "(" in the print; see F1.
  S7 [p3 §6.1, P003·R3] "Ta có: c'^n − 1 = Σ_{k=1}^{n−1} (−1)^k C_n^k
    (u+v)^{n−k−1} v^k + [(u+v)^{n−1} − 1]" — expand c'^n = Σ(−1)^i u^{n−1−i}v^i
    through (4') u+v = c^n; the k = 0 term is (u+v)^{n−1}.
  S8 [p4 §6.1, P004·R1] "Vì n là số nguyên tố và (u+v) ⋮̸ n, nên với k = 1..n−1
    thì C_n^k ⋮ n và [(u+v)^{n−1} − 1] ⋮ n (định lý nhỏ Fermat). Do đó
    (c'^n − 1) ⋮ n" — every summand carries C_n^k ⋮ n; the bracket is Fermat.
  S9 [p4 §6.1, P004·R1] "mà c' ⋮̸ n nên (c'^{n−1} − 1) ⋮ n, suy ra c'^n − 1 −
    (c'^{n−1} − 1) = c'^{n−1}(c' − 1) ⋮ n, suy ra c'(c' − 1) ⋮ n, suy ra
    c' = 1 + n k₃, với k₃ ∈ ℤ" — from n | c'^{n−1}(c'−1) and n ∤ c' (n prime)
    the author concludes c' ≡ 1 (mod n); cf. F1 note on the printed middle
    step "(c'^{n−1} − 1) ⋮ n", which is Fermat and unconditional.
  S10 [p4 §6.1, P004·R1] "Chứng minh tương tự ta cũng có a' = 1 + n k₁,
    b' = 1 + n k₂, với k₁,k₂ ∈ ℤ" — the same argument at (6')/(5').
  S11 [p4 §6.1, P004·R1] "suy ra t^n − u − v = (c.c')^n − c^n =
    c^n[(1 + n k₃)^n − 1] ⋮ n²" — t = c.c', u+v = c^n (4'), binomial expansion
    of (1+nk₃)^n (needs n ≥ 3 for n²).
  S12 [p4 §6.1, P004·R1] "Chứng minh tương tự ta cũng có (u^n − t + v) ⋮ n² và
    (v^n − t + u) ⋮ n² suy ra (u^n − t + v) + (v^n − t + u) − (t^n − u − v) =
    2(u + v − t) ⋮ n², suy ra (u+v−t) ⋮ n²" — (5),(6) with b',a' ≡ 1 mod n,
    then the three-term identity (which equals 2(u+v−t) exactly, and equals
    (u^n+v^n−t^n) + 2(u+v−t) under (3)), then division by 2 (n odd).
  S13 [p4 §6.1, P004·R1] "Từ (4'), (5'), (6') và (a,b) = (a,c) = (c,b) = 1 ta
    có u+v−t = c(c^{n−1} − c') = a(a' − a^{n−1}) = b(b' − b^{n−1}) = n^s abck,
    với k ∈ ℤ, s ∈ ℤ, s ≥ 2, (k,a) = (k,b) = (k,c) = 1, k ⋮̸ n, nếu k ≠ 0" —
    the three expressions all equal u+v−t; n² | u+v−t (S12) and abc coprime to
    n give s ≥ 2; k is then DEFINED by the last equality.
  S14 [p4 §6.1 end, P004·R1] "Suy ra u = b^n + n^s abck, v = a^n + n^s abck,
    t = c^n − n^s abck, a^n + b^n = c^n − 2n^s abck" — case 6.1 conclusion
    (h = c^n, since t ⋮̸ n): u = b b' = b^n + X, v = a a' = a^n + X, t = c c'
    = c^n − X, X = n^s abck.
  S15 [p4 §6.2, P004·R1] "Từ (4) suy ra (u+v) ⋮ n, áp dụng bổ đề 5b) ta có
    (u+v, Σ(−1)^i u^{n−1−i}v^i) = n và (Σ(−1)^i u^{n−1−i}v^i) ⋮̸ n²" — case
    6.2 (t ⋮ n): (4) gives n | t^n hence n | (u+v); bổ đề 5b).
  S16 [p4 §6.2, P004·R1] "kết hợp với (4) và áp dụng bổ đề 4, ta có:
