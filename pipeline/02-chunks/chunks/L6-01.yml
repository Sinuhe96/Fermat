id: L6-01
title: "Lemma 6 — four-term parametrisation of a primitive Fermat triple (u^n + v^n = t^n, uv ⋮̸ n): v = a^n + n^s abck, u = b^n + n^s abck, t = h − n^s abck, a^n + b^n = h − 2n^s abck (full lemma)"
pdf_pages: [1, 3, 4]
kind: lemma-statement
depends_on: [L3-01, L4-01, L5-01]
source_text: |
  [PDF p1 §A, lemma 6 of the seven-lemma list — region P001·R3]

  Bổ đề 6:
  Cho n là số nguyên tố lẻ. Giả sử PT: x^n + y^n = z^n (1) có nghiệm nguyên khác không x = u, y = v, z = t sao cho
  (u,v) = (u,t) = (v,t) = 1 và uv ⋮̸ n. Khi đó tồn tại 4 số nguyên a, b, c, k khác không, đôi một nguyên tố cùng nhau và
  không chia hết cho n, đồng thời tồn tại số nguyên s lớn hơn 1, sao cho:
  v = a^n + n^s abck, u = b^n + n^s abck, t = h − n^s abck, a^n + b^n = h − 2n^s abck ; với h = c^n, khi t ⋮̸ n hoặc h = n^{ns−1} c^n, khi t ⋮ n.

  [PDF p3 §6 "6. Chứng minh bổ đề 6" — region P003·R2 (tail). The region also carries the last lines of §5d; only the §6 part is transcribed here.]

  6. Chứng minh bổ đề 6.
  Vì x = u, y = v, z = t là nghiệm của PT (1) nên ta có u^n + v^n = t^n (3), suy ra: (u+v) Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i = t^n (4),
  (t−v) Σ_{i=0}^{n−1} t^{n−1−i} v^i = u^n (5),  (t−u) Σ_{i=0}^{n−1} t^{n−1−i} u^i = v^n (6)
  Xét hai trường hợp của t.
  6.1. Khi t không chia hết cho n.
  Ta có (u,v) = (u,t) = (v,t) = 1 và cùng với (4), (5), (6) suy ra (u+v) ⋮̸ n, (t−v) ⋮̸ n và (t−u) ⋮̸ n; áp dụng bổ đề

  [PDF p3 §6.1 continuation — region P003·R3]

  5 ta có (u+v, Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i) = (t−v, Σ_{i=0}^{n−1} t^{n−1−i} v^i) = (t−u, Σ_{i=0}^{n−1} t^{n−1−i} u^i) = 1, (Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i) ⋮̸ n, (Σ_{i=0}^{n−1} t^{n−1−i} v^i) ⋮̸ n,
  (Σ_{i=0}^{n−1} t^{n−1−i} u^i) ⋮̸ n, kết hợp với (4), (5), (6) và áp dụng bổ đề 3, ta có: u+v = c^n (4') và Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i = c'^n, với
  t = c.c', c, c' ∈ ℤ*, (c, c') = 1 và c ⋮̸ n, c' ⋮̸ n; t−v = b^n (5') và Σ_{i=0}^{n−1} t^{n−1−i} v^i = b'^n, với
  u = b.b', b, b' ∈ ℤ*, (b, b') = 1 và b ⋮̸ n, b' ⋮̸ n; t−u = a^n (6') và Σ_{i=0}^{n−1} t^{n−1−i} u^i = a'^n, với v = a.a', a, a' ∈ ℤ*, (a, a') = 1,
  và a ⋮̸ n, a' ⋮̸ n; (a, b) = (a, c) = (c, b) = 1 ((a, b) = (a, c) = (c, b) = 1 (vì (b.b', a.a') = (b.b', c.c') = (a.a', c.c') = 1)
  Ta có: c'^n − 1 = Σ_{k=1}^{n−1} (−1)^k C_n^k (u+v)^{n−k−1} v^k + [(u+v)^{n−1} − 1]. Vì n là số nguyên tố và (u+v) ⋮̸ n, nên với k = 1..(n−1)

  [PDF p4 §6.1 continuation and end — region P004·R1, first paragraph]

  thì C_n^k ⋮ n và [(u+v)^{n−1} − 1] ⋮ n (định lý nhỏ Fermat). Do đó (c'^n − 1) ⋮ n, mà c' ⋮̸ n nên (c'^{n−1} − 1) ⋮ n, suy ra c'^n − 1 − (c'^{n−1} − 1) = c'^{n−1}(c' − 1) ⋮ n, suy ra c'(c' − 1) ⋮ n, suy ra c' = 1 + n k₃, với k₃ ∈ ℤ. Chứng minh tương tự ta cũng có a' = 1 + n k₁, b' = 1 + n k₂, với k₁, k₂ ∈ ℤ, suy ra t^n − u − v = (c.c')^n − c^n = c^n[(1 + n k₃)^n − 1] ⋮ n². Chứng minh tương tự ta cũng có (u^n − t + v) ⋮ n² và (v^n − t + u) ⋮ n² suy ra (u^n − t + v) + (v^n − t + u) − (t^n − u − v) = 2(u + v − t) ⋮ n², suy ra (u+v−t) ⋮ n². Từ (4'), (5'), (6') và (a,b) = (a,c) = (c,b) = 1 ta có u+v−t = c(c^{n−1} − c') = a(a' − a^{n−1}) = b(b' − b^{n−1}) = n^s abck, với k ∈ ℤ, s ∈ ℤ, s ≥ 2, (k,a) = (k,b) = (k,c) = 1, k ⋮̸ n, nếu k ≠ 0. Suy ra u = b^n + n^s abck, v = a^n + n^s abck, t = c^n − n^s abck, a^n + b^n = c^n − 2n^s abck.

  [PDF p4 §6.2 — region P004·R1, second paragraph]

  6.2. Khi t chia hết cho n
  Từ (4) suy ra (u+v) ⋮ n, áp dụng bổ đề 5b) ta có (u+v, Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i) = n và (Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i) ⋮̸ n², kết hợp với (4) và áp dụng bổ đề 4, ta có: u+v = n^{sn−1}c^n (4'') và Σ_{i=0}^{n−1} (−1)^i u^{n−1−i} v^i = n c'^n với t = n^s c.c', s ∈ ℕ*; c, c' ∈ ℤ*, (c, c') = 1, c ⋮̸ n, c' ⋮̸ n. Ta có t^n − u − v = (n^s c.c')^n − n^{sn−1}c^n = n^{sn−1}c^n[n c'^n − 1] ⋮ n² (5'') (vì n là số nguyên tố lẻ, s ∈ ℕ*). Từ (5), (6) suy ra (t−v) ⋮̸ n và (t−u) ⋮̸ n, áp dụng bổ đề 5a) ta có (t−v, Σ_{i=0}^{n−1} t^{n−1−i} v^i) = (t−u, Σ_{i=0}^{n−1} t^{n−1−i} u^i) = 1, (Σ_{i=0}^{n−1} t^{n−1−i} v^i) ⋮̸ n, (Σ_{i=0}^{n−1} t^{n−1−i} u^i) ⋮̸ n, kết hợp với (5), (6) và áp dụng bổ đề 3 ta có t−v = b^n (5') và Σ_{i=0}^{n−1} t^{n−1−i} v^i = b'^n, với u = b b', b, b' ∈ ℤ*, (b, b') = 1, b ⋮̸ n, b' ⋮̸ n; t−u = a^n (6'), với v = a a', a, a' ∈ ℤ*, (a, a') = 1, a ⋮̸ n, a' ⋮̸ n; (a,b) = (a,c) = (c,b) = 1.

  [PDF p4 §6.2 continuation — region P004·R1, third paragraph. NOTE: (5') and (6') are re-used here after 6.1, and (5'') is used twice on this page (once above, once below) — printed labelling, transcribed as printed.]

  Lập luận như 6.1. ta có b' = 1 + n k₂, a' = 1 + n k₁, suy ra u^n − t + v = (b.b')^n − b^n = b^n[(1 + n k₂)^n − 1] ⋮ n² (5'') (và v^n − t + u = (a.a')^n − a^n = a^n[(1 + n k₁)^n − 1] ⋮ n² (6''), kết hợp (4''),(5'') và (6'') suy ra (u^n − t + v) + (v^n − t + u) − (t^n − u − v) = 2(u+v−t) ⋮ n², suy ra (u+v−t) ⋮ n², mà u+v−t = n^s c(n^{ns−1−s} c^{n−1} − c') = a(a' − a^{n−1}) = b(b' − b^{n−1}) = n^s abck nên s ≥ 2; (k,a) = (k,b) = (k,c) = 1 và k ⋮̸ n, nếu k ≠ 0. Suy ra v = a^n + n^s abck, u = b^n + n^s abck, t = n^{ns−1}c^n − n^s abck, a^n + b^n = n^{ns−1}c^n − 2n^s abck.

  [PDF p4 §6.2.1 — region P004·R1, fourth paragraph]

  6.2.1. Khi k = 0
  Ta nhận thấy khi k = 0 thì t−u = v, t−v = u, hay a^n = a.a', b^n = b.b', suy ra a^{n−1} = a', b^{n−1} = b' ⇒ |a| = |a'| = |b| = |b'| = 1 (vì (a,a') = (b,b') = 1)

  [PDF p4 §6.2.1 end + the lemma's summary — region P004·R2. The region also carries §7's opening; only the lemma-6 part is transcribed here.]

  ⇒ t = 0 ∨ t^n = 2, vô lý.
  Vậy, trong trường hợp k = 0, PT (1) vô nghiệm nguyên khác không.
  Theo 6.1. và 6.2., ta có kết quả quan trọng: v = a^n + n^s abck, u = b^n + n^s abck, t = h − n^s abck, a^n + b^n = h − 2n^s abck ; với
  h = c^n, khi t ⋮̸ n hoặc h = n^{ns−1}c^n, khi t ⋮ n, trong đó a, b, c, k là bốn số nguyên khác không và đôi một nguyên tố cùng
  nhau, đồng thời không chia hết cho n, s ∈ ℤ, s ≥ 2 (đpcm).

  [Notation as printed: ⋮ is the Vietnamese divisibility glyph ("a ⋮ b" = "a chia hết cho b" = b | a; argument order flips, ENCODING_MAP §A), ⋮̸ is the same glyph with a vector slash; a.b = a·b; ℤ* = nonzero integers; C_n^k is the binomial coefficient (the text layers lose sub/superscript pairing, so the region LaTeX is the read of record); Σ_{i=0}^{n−1} is set under the sum sign in the print, transcribed inline here. The slashed glyph is vector art dropped by both text layers — read from the REVIEWED region records, which record the glyph explicitly.]
formal_hint: |
  Hypotheses:
    n : ℕ, "n là số nguyên tố lẻ" — Nat.Prime n and 3 < n (odd);
    u v t : ℤ nonzero with u^n + v^n = t^n  ((1), the Fermat equation);
    pairwise coprimality of the triple: Int.gcd u v = 1, Int.gcd u t = 1,
      Int.gcd v t = 1  ("(u,v) = (u,t) = (v,t) = 1", which is bổ đề 1's output);
    uv ⋮̸ n, i.e. ¬ ((n : ℤ) ∣ u * v)  — since n is prime this is n ∤ u ∧ n ∤ v.
  Conclusion:
    ∃ a b c k : ℤ, ∃ s : ℕ,
      a ≠ 0 ∧ b ≠ 0 ∧ c ≠ 0 ∧ k ≠ 0 ∧
      pairwise coprime: Int.gcd a b = 1 ∧ Int.gcd a c = 1 ∧ Int.gcd c b = 1 ∧
        Int.gcd a k = 1 ∧ Int.gcd b k = 1 ∧ Int.gcd c k = 1 ∧
      ¬ (n ∣ a) ∧ ¬ (n ∣ b) ∧ ¬ (n ∣ c) ∧ ¬ (n ∣ k) ∧
      2 ≤ s ∧
      v = a ^ n + (n : ℤ) ^ s * (a * b * c * k) ∧
      u = b ^ n + (n : ℤ) ^ s * (a * b * c * k) ∧
      t = h − (n : ℤ) ^ s * (a * b * c * k) ∧
      a ^ n + b ^ n = h − 2 * (n : ℤ) ^ s * (a * b * c * k) ∧
      (h = c ^ n if ¬ (n ∣ t)   -- case 6.1
       h = (n : ℤ) ^ (n * s − 1) * c ^ n if n ∣ t)   -- case 6.2
  Reading: a primitive solution is governed by four parameters; u and v each
  differ from a pure n-th power (b^n, a^n) by the SAME "coupling" term
  X = n^s abck, and t is h − X for h = c^n (t ∤ n) resp. h = n^{ns−1}c^n
  (t ⋮ n), where c^n = u+v is the 6.1 factorisation and n^{ns−1}c^n = u+v the
  6.2 one. The statement's printed "số nguyên s lớn hơn 1" is s ≥ 2; the 6.2
  body prints "s ∈ ℕ*" first and concludes s ≥ 2 (see author_steps F1 notes).
